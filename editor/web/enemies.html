<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enemies</title>
<link rel="stylesheet" href="/style.css">
<style>
  .live { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .live.on { color: var(--ok); }
  #list .item { display: flex; gap: 8px; align-items: center; }
  #list .item > div { min-width: 0; flex: 1; }
  #list .item.off { opacity: .55; }
  #renBtn { width: 100%; margin: 8px 0 2px; text-align: left; }
  #renBtn.on { border-color: var(--accent); color: var(--accent); }
  .rrow { display: grid; grid-template-columns: 40px 1.3fr 1.3fr 1fr auto auto; gap: 8px; align-items: end; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rrow label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
  .rrow label.chk { flex-direction: row; align-items: center; gap: 5px; padding-bottom: 6px; }
  .rrow .seen { grid-column: 2 / -1; font-size: 11px; color: var(--muted); margin-top: -4px; }
  body.compact .rrow, .narrow .rrow { grid-template-columns: 40px 1fr 1fr; } body.compact .rrow .seen { grid-column: 1 / -1; }
  .mpic { width: 40px; height: 40px; border-radius: 6px; background: var(--chip); object-fit: contain; flex: none; }
  .mpic.big { width: 150px; height: 150px; border-radius: 12px; }
  .mpic.none { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); font-size: 18px; }
  .mpic.big.none { font-size: 52px; }
  .mpic.none { flex-direction: column; } .mpic.none small { display: block; font-size: 10px; font-weight: 400; line-height: 1.3; padding: 4px 8px 0; text-align: center; }
  .hero { display: flex; gap: 16px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .hero .main { flex: 1; min-width: 0; }
  .hero h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hero .tough { margin-top: 8px; font-size: 13px; }
  .hero .tough b { font-size: 14px; }
  .mstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 4px; margin-top: 10px; }
  .mstats div { background: var(--chip); border-radius: 6px; padding: 3px 7px; font-size: 12px; }
  .mstats div span { color: var(--muted); display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
  .mstats div b { font-size: 13px; }
  .mstats div.up b { color: var(--bad); } .mstats div.down b { color: var(--ok); }
  .mstats div i { font-style: normal; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .showing { font-size: 12px; margin-top: 8px; color: var(--muted); }
  .showing.ok { color: var(--ok); } .showing.bad { color: var(--bad); }
  .mlist { display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow: auto; margin-top: 8px; }
  .mcard { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .mcard:hover { border-color: var(--muted); }
  .mcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .mcard .mn { font-weight: 600; }
  .mcard .ms { font-size: 11px; color: var(--muted); }
  .mcard .mz { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
  .pickhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pickhead label { display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .pickhead select { width: auto; }
  .pickhead input { flex: 1; min-width: 160px; }
  .where { display: grid; grid-template-columns: minmax(260px, 1.3fr) minmax(220px, 1fr); gap: 12px; align-items: start; }
  .emap { position: relative; }
  .emap svg { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background: #20262b; cursor: crosshair; touch-action: none; }
  .emap .tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
  .emap .tools button { padding: 2px 8px; font-size: 12px; }
  .legend { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 8px; }
  .tw { display: grid; grid-template-columns: 112px 1fr 70px minmax(110px, auto); gap: 6px 10px; align-items: center; }
  .tw label { color: var(--ink); margin: 0; }
  .tw input[type=range] { width: 100%; }
  .tw input.num { width: 70px; }
  .tw .res { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tw .res b { color: var(--ink); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  /* in Build's inspector: no list (the spawn picker is in the header), one column */
  #spawnSel, #add2 { display: none; }
  body.compact main { grid-template-columns: 1fr; }
  body.compact aside, body.compact #save, body.compact #delPack, body.compact #live, body.compact #status { display: none !important; }
  body.compact #spawnSel, body.compact #add2 { display: inline-block; }
  body.compact #spawnSel { flex: 1; min-width: 0; }
  body.compact header { gap: 6px; padding: 6px 10px; flex-wrap: wrap; }
  body.compact header button { padding: 3px 8px; font-size: 12px; }
  body.compact #editor { padding: 10px 12px 40px; }
  body.compact .where { grid-template-columns: 1fr; }
  body.compact .hero { flex-direction: column; gap: 10px; } body.compact .mpic.big { width: 96px; height: 96px; }
  body.compact .tw { grid-template-columns: 84px 1fr 58px; } body.compact .tw .res { grid-column: 2 / 4; margin-top: -4px; }
  body.compact .tw input.num { width: 58px; }
  body.compact .grid { grid-template-columns: 1fr !important; }
  @media (max-width: 760px) {
    .where { grid-template-columns: 1fr; }
    .hero { flex-direction: column; } .mpic.big { width: 110px; height: 110px; }
    .tw { grid-template-columns: 90px 1fr 64px; } .tw .res { grid-column: 2 / 4; margin-top: -4px; }
  }
</style>
</head>
<body>
<header>
  <label style="color:var(--ink)">Pack <select id="packSel"></select></label>
  <button id="newPack">New pack</button>
  <button id="save" class="primary" title="Ctrl+S">Save pack</button>
  <button id="delPack" class="danger" title="Delete this pack (to the Recycle Bin)">Delete pack</button>
  <select id="spawnSel" title="Your spawns in this pack"></select><button id="add2" class="primary" title="New spawn">+</button>
  <span id="status">Loading…</span>
  <span id="live" class="live"></span>
</header>
<main>
  <aside>
    <div style="display:flex;gap:6px"><input id="search" placeholder="Search spawns…" style="flex:1"><button id="add" class="primary">+ Spawn</button></div>
    <div id="list"></div>
    <button id="renBtn" title="New names for the game's own monsters">✎ Rename the game's monsters</button>
  </aside>
  <section id="editor"></section>
</main>

<script src="/monsters.js"></script>
<script>
let D = { monsters: [], maps: {}, loot: {}, packs: [] }, MON = [];
let pack = null, packName = null, sel = null, dirty = false;
let live = { connected: false }, liveKinds = null, picking = false, pickZone = null, pickTerm = "", zoom = false, showing = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function status(msg, cls) { const s = $("#status"); s.textContent = msg; s.className = cls || ""; }
function setDirty(v = true) { dirty = v; status(v ? "Unsaved changes" : "Saved", v ? "" : "ok"); parent.postMessage({ dirty: v }, "*"); }
async function api(path, opts) { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
async function liveGet(p) { try { return await (await fetch("/api/live" + p)).json(); } catch (e) { return { connected: false }; } }
async function livePost(p, b) { try { return await (await fetch("/api/live" + p, { method: "POST", body: JSON.stringify(b || {}) })).json(); } catch (e) { return { connected: false }; } }

// The tweak sliders. "speed" ones are faster when higher.
const TWEAKS = [
  ["health", "Health", 0.1, 20], ["damage", "Damage", 0.1, 10], ["attackSpeed", "Attack speed", 0.25, 4], ["moveSpeed", "Move speed", 0.25, 3],
  ["defense", "Defense", 0, 10], ["sight", "Notices you at", 0.25, 4], ["exp", "Exp reward", 0, 20], ["gold", "Gold reward", 0, 20], ["size", "Size", 0.3, 4],
];
const PRESETS = {
  "Weaker": { health: 0.6, damage: 0.6, attackSpeed: 0.9, exp: 0.6, gold: 0.6 },
  "As in game": {},
  "Tough": { health: 2, damage: 1.3, defense: 1.3, exp: 1.6, gold: 1.5 },
  "Elite": { health: 3.5, damage: 1.7, attackSpeed: 1.15, defense: 1.6, exp: 3, gold: 3, size: 1.25 },
  "Boss": { health: 12, damage: 2.4, attackSpeed: 1.2, moveSpeed: 1.1, defense: 2, sight: 1.5, exp: 10, gold: 8, size: 1.7 },
};

// ---------------------------------------------------------------- loading
async function boot() {
  D = await api("/api/enemies/data");
  MON = mergeMonsters(D.monsters);
  const packs = D.packs.length ? D.packs : ["my-enemies"];
  fillPacks(packs);
  await openPack(packs.find(p => !(D.packsOff || []).includes(p)) || packs[0]);
  if (!MON.length) status("No monsters known yet: play with ContentLoader 1.4 and walk around a zone, then reload.", "bad");
  pollLive(); setInterval(pollLive, 5000);
}
async function pollLive() {
  const g = await liveGet("/status");
  const was = live.zone;
  live = g.connected && g.inWorld ? { connected: true, zone: g.zone } : { connected: !!g.connected };
  if (live.zone && (live.zone !== was || !liveKinds)) { const k = await liveGet("/enemy/kinds"); liveKinds = k.kinds ? new Set(k.kinds.map(x => x.name)) : null; if (sel != null) renderEditor(); }
  if (!live.zone) liveKinds = null;
  const el = $("#live");
  el.textContent = live.zone ? "● Game: in " + zoneName(live.zone) + " — changes show there now" : live.connected ? "Game: not in the world" : "Game not running";
  el.className = "live" + (live.zone ? " on" : "");
}
function fillPacks(names) {
  if (packName && !names.includes(packName)) names = [...names, packName];
  const off = new Set(D.packsOff || []);
  $("#packSel").innerHTML = names.map(p => `<option value="${esc(p)}">${esc(p)}${off.has(p) ? " (off)" : ""}</option>`).join("");
  if (packName) $("#packSel").value = packName;
}
function ensurePack(n) { if (![...$("#packSel").options].some(o => o.value === n)) $("#packSel").insertAdjacentHTML("beforeend", `<option value="${esc(n)}">${esc(n)}</option>`); $("#packSel").value = n; }
async function openPack(name) {
  if (dirty && !confirm("Discard unsaved changes?")) { $("#packSel").value = packName; return false; }
  pack = await api("/api/enemies/pack?name=" + encodeURIComponent(name));
  pack.enemies = pack.enemies || []; pack.renames = pack.renames || []; packName = name; sel = pack.enemies.length ? 0 : null; dirty = false; parent.postMessage({ dirty: false }, "*");
  ensurePack(name);
  status(`Pack "${name}": ${pack.enemies.length} spawn(s)`);
  renderList(); renderEditor();
  return true;
}

// ---------------------------------------------------------------- helpers
const kindOf = d => MON.find(m => m.name === d.monster && m.zone === d.zone) || MON.find(m => m.name === d.monster) || null;
const mult = (d, k) => d[k] == null ? 1 : +d[k];
function tweaked(s, d) {
  if (!s) return null;
  const o = { ...s }, dm = mult(d, "damage");
  if (o.health) o.health *= mult(d, "health");
  ["damage", "damageRandom", "weaponDamage", "weaponDamageRandom"].forEach(k => { if (o[k]) o[k] *= dm; });
  if (o.weaponSpeed) o.weaponSpeed *= mult(d, "attackSpeed");   // swings per second
  if (o.moveSpeed) o.moveSpeed *= mult(d, "moveSpeed");
  ["defense", "resistance"].forEach(k => { if (o[k]) o[k] *= mult(d, "defense"); });
  if (o.sightRange) o.sightRange *= mult(d, "sight");
  if (o.exp) o.exp = Math.round(o.exp * mult(d, "exp"));
  if (o.gold) o.gold = Math.round(o.gold * mult(d, "gold"));
  return o;
}
const shownName = d => d.name || d.monster || "No monster yet";
const zones = () => [...new Set([...MON.map(m => m.zone), ...Object.keys(D.maps || {})])].sort();
const monsIn = z => MON.filter(m => m.zone === z).sort((a, b) => a.name.localeCompare(b.name));
const newId = () => { const used = new Set(pack.enemies.map(e => e.id)); let id = Date.now() % 2000000000; while (used.has(id)) id++; return id; };
function problemsOf(d) {
  const p = [];
  if (!d.monster) p.push("pick a monster");
  else if (MON.length && !MON.some(m => m.name === d.monster && m.zone === d.zone)) p.push(`"${d.monster}" hasn't been seen in ${zoneName(d.zone)}: only monsters that live in a zone can be spawned there`);
  if (!d.zone) p.push("pick a zone");
  if (!d.x && !d.z) p.push("click the map to place it");
  if (pack.enemies.filter(e => e.id === d.id).length > 1) p.push("id used twice in this pack");
  return p;
}

// ---------------------------------------------------------------- list
function renderList() {
  const term = $("#search").value.trim().toLowerCase();
  const html = pack.enemies.map((d, i) => {
    const k = kindOf(d);
    if (term && !`${shownName(d)} ${d.monster} ${d.zone}`.toLowerCase().includes(term)) return "";
    const lv = k ? levelOf(tweaked(k.stats, d), MON) : null;
    return `<div class="item${sel === i ? " sel" : ""}${d.enabled === false ? " off" : ""}" data-i="${i}">${mpic(k || { name: d.monster })}
      <div><b>${esc(shownName(d))}${(d.count || 1) > 1 ? " ×" + d.count : ""}</b> ${levelBadge(lv, true)}<small>${esc(zoneName(d.zone) || "no zone")}${d.enabled === false ? " · off" : ""}</small></div></div>`;
  }).join("");
  $("#spawnSel").innerHTML = (pack.enemies.length ? pack.enemies.map((d, i) => `<option value="${i}" ${sel === i ? "selected" : ""}>${esc(shownName(d))}${(d.count || 1) > 1 ? " ×" + d.count : ""} · ${esc(zoneName(d.zone))}</option>`).join("") : `<option value="">No spawns yet</option>`) +
    `<option value="r" ${sel === "r" ? "selected" : ""}>✎ Rename the game's monsters${pack.renames.length ? " (" + pack.renames.length + ")" : ""}</option>`;
  $("#renBtn").textContent = "✎ Rename the game's monsters" + (pack.renames.length ? ` (${pack.renames.length})` : "");
  $("#renBtn").classList.toggle("on", sel === "r");
  $("#list").innerHTML = html || `<div class="empty">${pack.enemies.length ? "Nothing matches." : "No spawns in this pack yet."}</div>`;
  $("#list").querySelectorAll(".item").forEach(el => el.onclick = () => { sel = +el.dataset.i; picking = false; zoom = false; renderList(); renderEditor(); });
}
function addSpawn() {
  const z = live.zone || (sel != null && pack.enemies[sel] ? pack.enemies[sel].zone : null) || zones().sort((a, b) => monsIn(b).length - monsIn(a).length)[0] || "";
  const d = { id: newId(), enabled: true, monster: "", name: "", zone: z, x: 0, y: 0, z: 0, rotation: 0, count: 1, spread: 4, respawn: true, dropId: 0 };
  pack.enemies.push(d); sel = pack.enemies.length - 1; picking = true; pickZone = z; pickTerm = ""; zoom = false;
  setDirty(); renderList(); renderEditor();
}

// ---------------------------------------------------------------- editor
function renderEditor() {
  const ed = $("#editor");
  if (sel === "r") { renderRenames(); return; }
  const d = sel != null ? pack.enemies[sel] : null;
  if (!d) {
    ed.innerHTML = `<div class="empty"><p class="title">Put monsters where you want them</p>
      <p>Pick a monster, click the map where it should be, and make it weaker or tougher. Your game shows changes straight away while you're in that zone.</p>
      <p><button class="primary" id="mk">+ New spawn</button></p>
      <p class="hint">Packs are saved in <code>Mods\\Enemies</code> and need EnemyLoader. Only monsters that live in a zone can be spawned there (the game only has their models loaded there).</p></div>`;
    $("#mk").onclick = addSpawn; return;
  }
  const k = kindOf(d);
  ed.innerHTML = `${heroHtml(d, k)}<div class="problems" id="problems"></div>
    <fieldset><legend>Monster</legend><div id="pick"></div></fieldset>
    <fieldset><legend>Where</legend><div class="where"><div id="map"></div><div id="spot"></div></div></fieldset>
    <fieldset><legend>Tweaks</legend><div class="presets">${Object.keys(PRESETS).map(p => `<button data-preset="${esc(p)}">${esc(p)}</button>`).join("")}</div>
      <div class="tw" id="tweaks"></div>
      <p class="hint">1× is how the game has it. Attack speed 2× attacks twice as often. Damage scales every hit; health and defense make it last longer.</p></fieldset>
    <fieldset><legend>More</legend><div class="grid">
      <label>Name over its head (blank = its own)<input data-k="name" value="${esc(d.name)}" placeholder="${esc(d.monster || "")}"></label>
      <label>Loot it drops<select data-k="dropId">${lootOptions(d, k)}</select></label>
    </div>
    <div class="checks" style="margin-top:8px">
      <label><input type="checkbox" data-k="respawn" ${d.respawn !== false ? "checked" : ""}>Comes back after it's killed</label>
      <label><input type="checkbox" data-k="enabled" ${d.enabled !== false ? "checked" : ""}>On</label>
    </div>
    <p class="hint">A new name here changes what a "Defeat monsters" quest needs: use the new name there.
      ${d.monster ? `To rename every ${esc(d.monster)} in the game instead, <a href="#" id="renameKind">rename the kind</a>.` : ""}</p></fieldset>`;
  renderPick(d); renderMap(d); renderSpot(d); renderTweaks(d); wireHero(d);
  const rk = $("#renameKind"); if (rk) rk.onclick = e => { e.preventDefault(); addRename(d.monster, ""); };
  ed.querySelectorAll("[data-k]").forEach(el => el.onchange = () => {
    const f = el.dataset.k;
    d[f] = el.type === "checkbox" ? el.checked : f === "dropId" ? +el.value : el.value.trim();
    changed(d, f === "name" || f === "enabled");
  });
  ed.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
    const p = PRESETS[b.dataset.preset];
    TWEAKS.forEach(([key]) => { if (p[key] != null) d[key] = p[key]; else delete d[key]; });
    if (b.dataset.preset === "Boss") d.respawn = false;
    changed(d, true); renderTweaks(d); renderEditorTopOnly(d);
  });
  showProblems(d);
}
function renderEditorTopOnly(d) {   // the hero card and the list, without rebuilding the inputs
  const h = document.querySelector(".hero"); if (h) { h.outerHTML = heroHtml(d, kindOf(d)); wireHero(d); }
  renderList(); showProblems(d);
}
function heroHtml(d, k) {
  const base = k && k.stats, now = tweaked(base, d);
  const lv = now ? levelOf(now, MON) : null, lv0 = base ? levelOf(base, MON) : null;
  const like = now ? similarTo(now, MON, 3, d.monster) : [];
  const stats = now ? STATROWS.map(([t, f]) => {
    const v = f(now), w = f(base); if (!v) return "";
    const ch = v !== w, worse = ch && ["Health", "Damage", "Defense", "Resistance", "Speed", "Notices you at"].includes(t) ? cmp(now, base, t) : 0;
    return `<div class="${worse > 0 ? "up" : worse < 0 ? "down" : ""}"><span>${t}</span><b>${esc(v)}</b>${ch ? `<i>was ${esc(w)}</i>` : ""}</div>`;
  }).join("") : "";
  const sh = showing[d.id];
  return `<div class="hero">${mpic(k || { name: d.monster }, true)}<div class="main">
    <h2>${esc(shownName(d))}${(d.count || 1) > 1 ? ` <span style="font-weight:400;color:var(--muted)">×${d.count}</span>` : ""} ${levelBadge(lv)}</h2>
    <div class="sub">${d.name && d.monster ? "A " + esc(d.monster) + " · " : ""}${k && k.title ? esc(k.title) + " · " : ""}${esc(zoneName(d.zone))}${d.respawn === false ? " · doesn't come back" : ""}</div>
    ${lv != null ? `<div class="tough">Suggested fighting level <b>${lv}</b> — ${esc(tierOf(lv))}${lv0 != null && lv0 !== lv ? ` <span class="hint">(as in game: ${lv0})</span>` : ""}
      ${like.length ? `<div class="hint">About as tough as ${like.map(m => `<b>${esc(m.name)}</b> (${esc(zoneName(m.zone))})`).join(", ")}</div>` : ""}</div>`
      : `<div class="tough hint">${d.monster ? "No stats for it yet: walk near one in game with ContentLoader 1.4, then reload." : "Pick a monster below."}</div>`}
    ${stats ? `<div class="mstats">${stats}</div>` : ""}
    <div class="actions" style="margin-top:10px"><button id="goto" ${live.connected ? "" : "disabled"} title="Teleport there in game">Go there in game</button>
      <button id="dup">Duplicate</button><button class="danger" id="del">Delete</button></div>
    <div class="showing ${sh ? sh.cls : ""}">${sh ? esc(sh.text) : live.zone ? (d.zone === live.zone ? "" : "Your game is in " + esc(zoneName(live.zone)) + ": this shows when you go to " + esc(zoneName(d.zone)) + ".") : "Saved spawns appear when you enter the zone (EnemyLoader)."}</div>
  </div></div>`;
}
function cmp(a, b, t) {   // +1 = tougher for the player, -1 = easier
  const key = { Health: "health", Defense: "defense", Resistance: "resistance", Speed: "moveSpeed", "Notices you at": "sightRange" }[t];
  if (t === "Damage") { const x = damageRange(a), y = damageRange(b); return x && y ? Math.sign(x[1] - y[1]) : 0; }
  return key ? Math.sign((a[key] || 0) - (b[key] || 0)) : 0;
}
function wireHero(d) {
  $("#del").onclick = () => {
    if (!confirm(`Delete "${shownName(d)}" from this pack?`)) return;
    livePost("/enemy/remove?id=" + d.id);
    pack.enemies.splice(sel, 1); sel = pack.enemies.length ? Math.min(sel, pack.enemies.length - 1) : null; setDirty(); renderList(); renderEditor();
  };
  $("#dup").onclick = () => {
    const c = JSON.parse(JSON.stringify(d)); c.id = newId(); c.x = (+c.x || 0) + 15; c.z = (+c.z || 0) + 15;
    pack.enemies.splice(sel + 1, 0, c); sel++; setDirty(); renderList(); renderEditor(); pushLive(c);
  };
  $("#goto").onclick = async () => { const r = await livePost("/enemy/goto", d); status(r.ok ? "Teleported" : "Couldn't: " + (r.error || "game not running"), r.ok ? "ok" : "bad"); };

// ---------------------------------------------------------------- the map
function renderMap(d) {

// ---------------------------------------------------------------- tweaks
// Sliders work in doublings, so ×0.5 and ×2 sit the same distance from the middle.
const toSlider = (v, lo, hi) => v <= 0 ? -1000 : Math.round(Math.log2(Math.max(lo || 0.01, Math.min(hi, v))) * 100);
const fromSlider = s => s <= -1000 ? 0 : Math.round(Math.pow(2, s / 100) * 100) / 100;
function renderTweaks(d) {
  const k = kindOf(d), base = k && k.stats;

    if (!base) return "";

    const show = (f, unit = "") => { const a = f(base), b = f(now); return a == null ? "" : a === b ? `<b>${a}${unit}</b>` : `${a}${unit} → <b>${b}${unit}</b>`; };
    switch (key) {
      case "health": return show(s => s.health ? fmt(s.health) : null);
      case "damage": return show(damageOf);
      case "attackSpeed": return show(s => s.weaponSpeed ? fmt(1 / s.weaponSpeed) : null, " s");
      case "moveSpeed": return show(s => s.moveSpeed ? fmt(s.moveSpeed) : null);
      case "defense": return show(s => s.defense != null ? fmt(s.defense || 0) : null);
      case "sight": return show(s => s.sightRange ? fmt(s.sightRange) : null, " m");
      case "exp": return show(s => s.exp != null ? fmt(s.exp || 0) : null);

    }
  };
  $("#tweaks").innerHTML = TWEAKS.map(([key, label, lo, hi]) => {

      <input class="num" type="number" min="0" step="0.05" value="${v}" data-twn="${key}" title="×">

function gameEdit(ev) {

  }

    pack.renames = pack.renames || [];
    setDirty(false); status(`Saved ${r.count} spawn(s)${pack.renames.length ? ` and ${pack.renames.length} rename(s)` : ""}${r.enabled ? "" : " (pack is off)"}. They appear when you enter their zone.`, "ok");
    if (sel === "r") renderEditor(); renderList();
    parent.postMessage({ broadcast: { cmd: "packsChanged", kind: "enemies" } }, "*");
  } catch (e) { status("Save failed: " + e.message, "bad"); }
}
async function deletePack() {
  const exists = ((await api("/api/overview")).packs.enemies || []).some(p => p.name === packName);
  if (!confirm(exists ? `Delete the pack "${packName}"?\n\nIt goes to the Recycle Bin, so you can get it back.` : `"${packName}" was never saved. Throw it away?`)) return;
  if (exists) { try { await api(`/api/packs/delete?kind=enemies&name=${encodeURIComponent(packName)}`, { method: "POST" }); } catch (e) { status("Couldn't delete: " + e.message, "bad"); return; } }
  pack.enemies.forEach(d => livePost("/enemy/remove?id=" + d.id));
  if ((pack.renames || []).length) livePost("/enemy/renames", { pack: packName, renames: [] });
  const left = ((await api("/api/overview")).packs.enemies || []).map(p => p.name);
  dirty = false; parent.postMessage({ dirty: false }, "*");
  D.packs = left; packName = null; fillPacks(left.length ? left : ["my-enemies"]);
  await openPack(left[0] || "my-enemies");
  parent.postMessage({ broadcast: { cmd: "packsChanged", kind: "enemies" } }, "*");
}

window.addEventListener("message", async e => {
  const m = e.data || {};
  if (m.cmd === "openPack") { if (m.name !== packName) { ensurePack(m.name); await openPack(m.name); } }
  if (m.cmd === "save" && pack && dirty) save();
  if (m.cmd === "layout") { document.body.classList.toggle("compact", !!m.compact); if (pack) renderEditor(); }
  if (m.cmd === "discard" && pack && dirty) { if (!m.confirmed && !confirm("Throw away your unsaved changes to enemies?")) return; dirty = false; const n = packName; packName = null; await openPack(n); respawnLive(); }
  if (m.cmd === "newEnemyAt" && pack) {   // from Build's Assets panel: a new spawn where the camera looks
    const d = { id: newId(), enabled: true, monster: m.monster, name: "", zone: m.zone, x: Math.round(m.x * 10) / 10, y: Math.round(m.y * 10) / 10, z: Math.round(m.z * 10) / 10,
                rotation: Math.round(m.rotation || 0), count: 1, spread: 4, respawn: true, dropId: 0 };
    pack.enemies.push(d); sel = pack.enemies.length - 1; picking = false; zoom = true;
    setDirty(); renderList(); renderEditor(); pushLive(d);
  }
  if (m.cmd === "gameEdit" && pack) gameEdit(m.ev);
  if (m.cmd === "select") { const i = pack.enemies.findIndex(d => d.id == m.id); if (i >= 0) { sel = i; renderList(); renderEditor(); } }
  if (m.cmd === "packsChanged" && m.kind === "content") { const f = await api("/api/enemies/data"); D.monsters = f.monsters; D.maps = f.maps; MON = mergeMonsters(D.monsters); renderList(); renderEditor(); }
});
$("#delPack").onclick = deletePack;
$("#save").onclick = save;
$("#add").onclick = addSpawn;
$("#add2").onclick = addSpawn;
$("#renBtn").onclick = () => { sel = "r"; picking = false; renderList(); renderEditor(); };
$("#spawnSel").onchange = e => { if (e.target.value === "r") { sel = "r"; renderList(); renderEditor(); return; } const i = +e.target.value; if (pack.enemies[i]) { sel = i; picking = false; zoom = false; renderList(); renderEditor(); } };
$("#packSel").onchange = e => openPack(e.target.value);
$("#newPack").onclick = () => {
  const n = prompt("Name for the new pack (letters, numbers, spaces, - and _):", "my-enemies");
  if (!n) return; ensurePack(n); openPack(n);
};
$("#search").oninput = renderList;
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (document.body.classList.contains("compact")) parent.postMessage({ key: "ctrl-s" }, "*"); else save(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); parent.postMessage({ key: "ctrl-k" }, "*"); }
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
boot().then(() => parent.postMessage({ ready: true }, "*")).catch(e => { status("Couldn't load: " + e.message, "bad"); parent.postMessage({ ready: true, error: e.message }, "*"); });
</script>
</body>
</html>
