<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPCs</title>
<link rel="stylesheet" href="/style.css">
<style>
  #live { margin-left: 6px; font-size: 12px; padding: 2px 9px; }
  #live.on { color: var(--ok); border: 1px solid var(--ok); }
  .livebox { border-color: var(--accent); }
  .livebox legend { color: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 38px); gap: 4px; }
  .pad button { padding: 6px 0; }
  .liverow { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .liverow .col { display: flex; flex-direction: column; gap: 6px; }
  #liveNote { min-height: 18px; }

  /* a vendor's list: one card per item */
  .vendor legend { font-size: 14px; }
  .vsum { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .vsum b { color: var(--ink); }
  .vsum .bar { flex: 1 1 100%; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .vsum .bar i { display: block; height: 100%; background: var(--accent); }
  .vsum .bar.over i { background: var(--bad); }
  .cards { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .card { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 4px 12px; align-items: start; padding: 8px 10px;
          background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 6px; }
  .card.bad { border-color: var(--bad); }
  .ico { width: 44px; height: 44px; border-radius: 6px; background: var(--chip); object-fit: contain; }
  .ico.sm { width: 28px; height: 28px; border-radius: 4px; flex: none; }
  .noicon { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
  .card .info { min-width: 0; }
  .card .name { font-weight: 600; font-size: 14px; }
  .card .kind { font-size: 12px; color: var(--muted); }
  .card .kind .id { opacity: .6; margin-left: 4px; }
  .card .facts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .card .facts span { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--chip); color: var(--ink); }
  .card .desc { font-size: 12px; font-style: italic; color: var(--muted); margin-top: 5px; }
  .card .warn, .vendor .warn { color: var(--bad); font-size: 12px; }
  .card .buy { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .card .price { display: flex; flex-direction: column; align-items: flex-end; margin: 0; font-size: 11px; color: var(--muted); }
  .card .price .in { display: flex; align-items: center; gap: 4px; }
  .card .price input { width: 80px; text-align: right; font-weight: 600; }
  .card .price b { font-weight: 400; color: var(--muted); font-size: 12px; }
  .card .usual { font-size: 11px; color: var(--muted); }
  .card .stock { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .card .stock span { margin-right: 3px; }
  .card .stock input { width: 46px; text-align: center; }
  .card .stock button { padding: 1px 8px; }
  .card .tools { display: flex; flex-direction: column; gap: 3px; }
  .card .tools button { padding: 1px 7px; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; text-decoration: underline; }
  .adder .row { display: flex; gap: 6px; }
  .adder #addSell { flex: 1; min-width: 160px; }
  .picks { max-height: 260px; overflow: auto; border-radius: 6px; }
  .picks:not(:empty) { border: 1px solid var(--line); margin-top: 4px; background: var(--panel); }
  .pick { display: flex; align-items: center; gap: 8px; padding: 4px 8px; cursor: pointer; }
  .pick.on, .pick:hover { background: var(--chip); }
  .pick .pn { font-weight: 600; }
  .pick .pk { font-size: 11px; color: var(--muted); }
  .pick .pp { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .vendor details { margin-top: 6px; }
  .vendor details summary { cursor: pointer; color: var(--accent); }
  .vendor details .row { margin-top: 6px; align-items: center; gap: 6px; }
  p.hint.bad { color: var(--bad); }
  /* narrow (the Build inspector): price and stock go under the item */
  body.compact .card { grid-template-columns: 40px 1fr auto; }
  body.compact .card .buy { grid-column: 2 / 3; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  body.compact .card .price { flex-direction: row; gap: 4px; align-items: center; }
  body.compact .card .tools { grid-column: 3; grid-row: 1; }
  body.compact .ico { width: 40px; height: 40px; }
  @media (max-width: 560px) {
    .card { grid-template-columns: 40px 1fr auto; }
    .card .buy { grid-column: 2 / 3; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .card .price { flex-direction: row; gap: 4px; align-items: center; }
    .card .tools { grid-column: 3; grid-row: 1; }
    .pick .pk { display: none; }
  }

  /* narrow, as the Build layout's inspector: only the selected thing's settings */
  body.compact main { grid-template-columns: 1fr; height: calc(100vh - 47px); }
  body.compact aside, body.compact #gvHost, body.compact #liveBox { display: none !important; }
  body.compact header { gap: 6px; padding: 6px 10px; }
  body.compact header button { padding: 3px 8px; font-size: 12px; }
  /* the Build toolbar has Save / Undo / Discard; Delete pack lives on the full page */
  body.compact #save, body.compact #delPack, body.compact #discard, body.compact #undo, body.compact #live { display: none !important; }
  body.compact #editor { padding: 10px 12px 40px; }
  body.compact .grid { grid-template-columns: 1fr 1fr !important; }
  /* the quests an NPC gives: click one for a pop-up of what it is */
  ul.qlist { list-style: none; margin: 4px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  ul.qlist li button { width: 100%; text-align: left; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; }
  ul.qlist li button:hover { border-color: var(--accent); }
  ul.qlist li button b { font-weight: 600; }
  ul.qlist li button .hint { margin: 0; }
  .qback { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
  .qpop { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.4); width: min(560px, 100%); max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
  .qpop .qh { padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
  .qpop .qh h3 { margin: 0; font-size: 18px; }
  .qpop .qh .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .qpop .qb { padding: 10px 16px; overflow: auto; }
  .qpop .qb h4 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .qpop .qb h4:first-child { margin-top: 2px; }
  .qpop .qb p { margin: 2px 0; }
  .qpop .say { font-style: italic; white-space: pre-wrap; background: var(--chip); border-radius: 8px; padding: 7px 10px; }
  .qpop .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .qpop .chips span { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--chip); }
  .qpop .qf { padding: 10px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .qpop .qf .hint { flex: 1; min-width: 160px; margin: 0; }
</style>
<script src="/gameview.js"></script>
</head>
<body>
<header>
  <label style="color:var(--ink)">Pack <select id="packSel"></select></label>
  <button id="newPack">New pack</button>
  <button id="newNpc">New NPC</button>
  <button id="save" class="primary" title="Ctrl+S">Save pack</button>
  <button id="delPack" class="danger" title="Delete this pack (to the Recycle Bin)">Delete pack</button>
  <button id="discard" title="Throw away unsaved changes (and put the game back as saved)">Discard changes</button>
  <span id="status">Loading…</span>
  <span id="live" class="badge off" title="Live link to the running game">○ Game not running</span>
</header>
<div class="offbar" id="offBar" hidden>⚠ This pack is switched off, so the game ignores it. <button id="offOn">Switch it on</button></div>
<main>
  <aside>
    <input id="search" type="search" placeholder="Search name, id, zone…">
    <div id="list"></div>
  </aside>
  <section id="editor"><div id="gvHost"></div><div id="ed"></div></section>
</main>

<script>
const FIRST_ID = 90001;
const JOB = { quest: "Quest giver", shop: "Shopkeeper", shopSG: "Gem shop", alchemy: "Alchemist", bank: "Banker", share: "Shared bank", skillReset: "Skill reset", bagShop: "Bag seller", battleGrid: "Battle grid", none: "Just stands there" };
const ROLES = {
  quest: "Talks: offers and takes the quests that have this NPC as giver or hand-in",
  shop: "Opens a shop: pick what they sell and the prices below",
  alchemy: "Opens the alchemy window",
  bank: "Opens the bank",
  share: "Opens the shared bank",
  skillReset: "Offers a skill reset",
  none: "Nothing: just someone standing there",
};
let D = {}, pack = null, packName = null, sel = -1, dirty = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const zoneName = z => String(z || "").replace(/^Zone_/, "").replace(/([a-z])([A-Z])/g, "$1 $2");
const r1 = v => Math.round((+v || 0) * 10) / 10;

function status(msg, cls) { const s = $("#status"); s.textContent = msg; s.className = cls || ""; }
function setDirty(v = true) { dirty = v; status(v ? "Unsaved changes" : "Saved", v ? "" : "ok"); parent.postMessage({ dirty: v }, "*"); if (v) scheduleLive(); announce(); }
// The outliner lists this pack's NPCs as they are here (unsaved ones too).
let announceTimer = null;
function announce() {
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => { if (pack) parent.postMessage({ broadcast: { cmd: "npcState", pack: packName, dirty,
    npcs: pack.npcs.map(n => ({ cid: n.id, name: n.name, zone: n.zone, x: n.x, y: n.y, z: n.z, pack: packName })) } }, "*"); }, 80);
}
async function api(path, opts) { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; }

// The game's own NPCs (from QuestLoader's export), by zone.
const gameNpcs = () => (D.npcs || []).filter(n => n.cid > 0 && n.cid < FIRST_ID);
const zones = () => [...new Set([...gameNpcs().map(n => n.zone), ...(pack ? pack.npcs.map(n => n.zone) : [])].filter(Boolean))].sort();
const npcsIn = z => gameNpcs().filter(n => n.zone === z).sort((a, b) => (a.name || "").localeCompare(b.name || "") || a.cid - b.cid);
const gameNpc = cid => gameNpcs().find(n => n.cid === cid);

async function boot() {
  D = await api("/api/npcs/data");
  loadItems();
  const packs = D.packs.length ? D.packs : ["my-npcs"];
  fillPacks(packs);
  await openPack(packs.find(p => !(D.packsOff || []).includes(p)) || (ensurePack("my-npcs"), "my-npcs"));
  if (!gameNpcs().length) status("No NPC list yet: play once with QuestLoader installed (visit a zone), then reload.", "bad");
}

function fillPacks(names) {
  if (packName && !names.includes(packName)) names = [...names, packName];   // (a new pack, not saved yet)
  const off = new Set(D.packsOff || []);
  $("#packSel").innerHTML = names.map(p => `<option value="${esc(p)}">${esc(p)}${off.has(p) ? " (off)" : ""}</option>`).join("");
  if (packName) $("#packSel").value = packName;
}
function ensurePack(n) { if (![...$("#packSel").options].some(o => o.value === n)) $("#packSel").insertAdjacentHTML("beforeend", `<option value="${esc(n)}">${esc(n)}</option>`); $("#packSel").value = n; }

async function openPack(name) {
  if (dirty && !confirm("Discard unsaved changes?")) { $("#packSel").value = packName; return false; }
  const discarded = dirty;
  pack = await api("/api/npcs/pack?name=" + encodeURIComponent(name));
  pack.npcs = pack.npcs || []; packName = name; sel = pack.npcs.length ? 0 : -1; dirty = false; parent.postMessage({ dirty: false }, "*");
  if (discarded && G.connected && G.inWorld) fetch("/api/live/reload", { method: "POST", body: "{}" }).catch(() => {});   // the game showed the thrown-away edits
  status(`Pack "${name}": ${pack.npcs.length} NPC(s)`);
  renderList(); renderEditor(); announce();
  updateOffBar();
}

// Ids used by every pack (this one as edited, the others as saved).
function usedIds() {
  const ids = (D.custom || []).filter(n => n.pack !== packName).map(n => n.id || n.cid);
  return [...ids, ...pack.npcs.map(n => n.id)];
}
const nextId = () => Math.max(FIRST_ID - 1, ...usedIds().filter(i => i >= FIRST_ID)) + 1;

function newNpc(near, keepSpot) {
  const z = near ? near.zone : (zones().includes("Zone_CrimsonIsles") ? "Zone_CrimsonIsles" : zones()[0] || "Zone_CrimsonIsles");
  const base = near || npcsIn(z)[0] || { x: 0, y: 0, z: 0, cid: 0 };
  const n = { id: nextId(), name: "New NPC", zone: z, x: r1(base.x + 1.5), y: r1(base.y), z: r1(base.z), rotation: 0,
              template: base.cid || 0, role: "quest" };
  pack.npcs.push(n); sel = pack.npcs.length - 1; setDirty(); renderList(); renderEditor();
  if (!near && !keepSpot && G.connected && G.inWorld && $("#lvHere")) $("#lvHere").click();   // start in front of the player
}

// ---------------------------------------------------------------- list
function renderList() {
  const term = $("#search").value.trim().toLowerCase();
  const html = pack.npcs.map((n, i) => {
    if (term && !`${n.id} ${n.name} ${n.zone} ${n.role}`.toLowerCase().includes(term)) return "";
    return `<div class="item${i === sel ? " sel" : ""}" data-i="${i}"><b>${esc(n.name || "(no name)")}</b>
      <span class="badge">${esc(JOB[n.role || "quest"] || n.role)}</span>${n.enabled === false ? '<span class="badge off">hidden</span>' : ""}
      <small>#${n.id} · ${esc(zoneName(n.zone))} · looks like ${esc((gameNpc(n.template) || {}).name || "NPC " + n.template)}</small></div>`;
  }).join("");
  $("#list").innerHTML = html || `<div class="empty">${pack.npcs.length ? "Nothing matches." : "No NPCs in this pack yet."}</div>`;
  $("#list").querySelectorAll(".item").forEach(el => el.onclick = () => { sel = +el.dataset.i; renderList(); renderEditor(); });
}


// ---------------------------------------------------------------- what a quest is (a pop-up)
// The NPC list only has each quest's title: the whole quest comes from the Quests data (the game's)
// or its pack (yours), fetched the first time one is opened.
let QD = null;
async function questData() {
  if (!QD) {
    const d = await (await fetch("/api/quests/data")).json();
    QD = { d, item: {}, npc: {}, flag: {} };
    (d.items || []).forEach(i => QD.item[i.id] = i.name);
    (d.npcs || []).forEach(n => { if (!QD.npc[n.cid]) QD.npc[n.cid] = String(n.name || "").replace(" (custom)", ""); });
    (d.originals || []).forEach(q => { if (q.clearFlag > 0) QD.flag[q.clearFlag] = q.title; });
  }
  return QD;
}
async function fullQuest(q) {
  const Q = await questData();
  if (q.where === "game") return (Q.d.originals || []).find(o => o.id === q.id) || q;
  const p = await (await fetch("/api/quests/pack?name=" + encodeURIComponent(q.where))).json();
  (p.quests || []).forEach(x => { if (x.clearFlag > 0) Q.flag[x.clearFlag] = x.title; });
  return (p.quests || []).find(x => x.id === q.id) || q;
}
async function showQuest(q) {
  closeQuest();
  const back = document.createElement("div"); back.className = "qback"; back.id = "qback";
  back.innerHTML = `<div class="qpop" role="dialog" aria-label="Quest"><div class="qh"><h3>${esc(q.title || "?")}</h3><div class="sub">Loading…</div></div></div>`;
  document.body.appendChild(back);
  back.onclick = e => { if (e.target === back) closeQuest(); };
  let f, Q;
  try { f = await fullQuest(q); Q = await questData(); } catch (e) { back.querySelector(".sub").textContent = "Couldn't load it: " + e.message; return; }
  if (!document.getElementById("qback")) return;   // closed meanwhile
  const who = c => !(c > 0) ? "nobody" : esc(Q.npc[c] || (pack && (pack.npcs.find(n => n.id === c) || {}).name) || "NPC " + c);
  const item = (id, n) => `${n === -1 ? "" : (n || 1) + " × "}${esc(Q.item[id] || "item " + id)}${n === -1 ? " (just have one)" : ""}`;
  const goals = (f.targets || []).map(t => t.kind === "kill" ? `Defeat ${t.count || 1} × ${esc(t.monster || "monster #" + t.monsterId)}` : `Bring ${item(t.item, t.count)}`);
  const rewards = (f.rewards || []).map(r => r.kind === "exp" ? `${r.amount} exp` : r.kind === "gold" ? `${r.amount} gold` : item(r.item, r.amount));
  const gets = (f.receives || []).map(r => item(r.item, r.count));
  const req = f.requires || {}, when = [];
  (req.flagsAll || []).forEach(x => when.push(`${x.on ? "After" : "Before"} ${Q.flag[x.flag] ? `“${esc(Q.flag[x.flag])}” is done` : "flag " + x.flag}`));
  (req.itemsAll || []).forEach(x => when.push(`Has ${x.atLeast === false ? "fewer than" : "at least"} ${item(x.item, x.count)}`));
  if (Object.keys(req).some(k => !["flagsAll", "itemsAll"].includes(k) && (req[k] || []).length)) when.push("Other conditions (see the Quests tab)");
  const sec = (h, body) => body ? `<h4>${h}</h4>${body}` : "";
  const list = a => a.length ? `<ul class="plain">${a.map(x => `<li>${x}</li>`).join("")}</ul>` : "";
  const mine = q.where !== "game";
  back.querySelector(".qpop").innerHTML = `
    <div class="qh"><h3>${esc(f.title || "?")}</h3>
      <div class="sub">#${f.id} · ${mine ? "your quest, in pack " + esc(q.where) + (q.enabled === false ? " (pack is off)" : "") : "one of the game's own quests"}${f.enabled === false ? " · switched off" : ""}</div>
      ${(f.types || []).length ? `<div class="chips" style="margin-top:6px">${f.types.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}</div>
    <div class="qb">
      ${sec("Objective", f.objective ? `<p>${esc(f.objective)}</p>` : "")}
      <h4>Who</h4><p>Given by <b>${who(f.giver)}</b>, handed in to <b>${who(f.ender)}</b></p>
      ${sec("What they say", f.description ? `<div class="say">${esc(f.description)}</div>` : "")}
      ${sec("Goal", list(goals) || '<p class="hint">No goal: just talk to them.</p>')}
      ${sec("Rewards", list(rewards))}
      ${sec("Given when you accept", list(gets))}
      ${sec("Offered", list(when) || "<p>Right away</p>")}
      ${sec("When you hand it in", f.descriptionForEnder ? `<div class="say">${esc(f.descriptionForEnder)}</div>` : "")}
      ${(f.repeatable || f.autoReopen) ? '<p class="hint" style="margin-top:8px">Can be done again.</p>' : ""}
    </div>
    <div class="qf"><button class="primary" id="qEdit">${mine ? "Edit in Quests" : "Open in Quests"}</button><button id="qClose">Close</button>
      <span class="hint">${mine ? "" : "Game quests are read-only there: copy one to change it."}</span></div>`;
  $("#qClose").onclick = closeQuest;
  $("#qEdit").onclick = () => {
    closeQuest();
    const pick = { cmd: "select", id: f.id };
    parent.postMessage({ nav: "quests", msg: mine ? { cmd: "openPack", name: q.where, then: pick } : pick }, "*");
  };
  $("#qEdit").focus();
}
function closeQuest() { const b = document.getElementById("qback"); if (b) b.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("qback")) { e.stopPropagation(); closeQuest(); } }, true);

// ---------------------------------------------------------------- editor
function questsOf(id) {
  const out = [];
  (D.originals || []).forEach(q => { if (q.giver === id || q.ender === id) out.push({ ...q, where: "game" }); });
  (D.packQuests || []).forEach(q => { if (q.giver === id || q.ender === id) out.push({ ...q, where: q.pack }); });
  return out;
}

function problemsOf(n) {
  const p = [];
  if (!n.name) p.push("needs a name");
  if (!(n.id >= FIRST_ID)) p.push(`ids should be ${FIRST_ID} or higher, so they never clash with the game's NPCs`);
  if (usedIds().filter(i => i === n.id).length > 1) p.push("id " + n.id + " is used by another NPC");
  if (!n.template) p.push("pick an NPC to copy the look from");
  else if (gameNpcs().length && !npcsIn(n.zone).some(t => t.cid === n.template)) p.push("the look-alike NPC isn't in this zone (it has to be)");
  if (!ROLES[n.role || "quest"]) p.push("unknown role");
  if (n.role === "shop" && n.sells) {
    if (!n.sells.length) p.push("the shop has nothing to sell yet");
    if (n.sells.some(s => !knownItem(s.id))) p.push("an item on the shop list isn't in the game");
    if (slotsOf(n) > SLOTS) p.push(`the shop window has ${SLOTS} slots; the list needs ${slotsOf(n)}`);
    const cheap = n.sells.find(s => s.price > 0 && sellBack(s.id) != null && s.price < sellBack(s.id));
    if (cheap) p.push(`${iname(cheap.id)} costs less than players get for selling it back (${sellBack(cheap.id)}), so they could make money`);
  }
  return p;
}

function renderEditor() {
  const ed = $("#ed");
  if ((sel < 0 || !pack.npcs[sel]) && document.body.classList.contains("compact")) {
    ed.innerHTML = `<div class="empty" style="margin:30px 10px"><p class="title">No NPC selected</p><p>Click one of your NPCs in the 3D view or the outliner, or pick someone in Assets ▸ NPCs to add a new one.</p></div>`;
    return;
  }
  if (sel < 0 || !pack.npcs[sel]) {
    ed.innerHTML = `<div class="empty"><p class="title">Add people to the world</p>
      <p>Each NPC is a copy of one of the game's own NPCs in the same zone (its body, clothes and animations), with its own name, place and job.</p>

  71: "Armor mold", 72: "Jewel mold", 78: "Amulet", 79: "Ring", 80: "Key" };

  onehand: "One-handed weapon", twohand: "Two-handed weapon", bow: "Bow", shield: "Shield", mainhand: "Wand" };

// The item search under the list: what you type, in which group, best matches first.
let addTerm = "", addGroup = "all", addPick = 0;

  add.onkeydown = e => {
    const m = pickMatches();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); addPick = Math.max(0, Math.min(m.length - 1, addPick + (e.key === "ArrowDown" ? 1 : -1))); renderPicks(n); const on = $("#picks .pick.on"); if (on) on.scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { e.preventDefault(); if (m[addPick]) addItem(n, m[addPick][0]); }
    else if (e.key === "Escape") { addTerm = ""; add.value = ""; renderPicks(n); }
  };
  grp.onchange = () => { addGroup = grp.value; addPick = 0; add.focus(); renderPicks(n); };
  const cv = $("#copyVendor"); if (cv) cv.onchange = () => {
    const st = (D.vendorStock || {})[cv.value]; if (!st) return;
    if (n.sells.length && !confirm(`Replace the ${n.sells.length} item(s) on the list with what ${vendorName(cv.value)} sells?`)) { cv.value = ""; return; }
    n.sells = st.map(([id, c]) => ({ id, stock: Math.min(SLOTS, c || 1) })); re();
  };
  const pg = $("#pctGo"); if (pg) pg.onclick = () => {
    const p = +$("#pct").value; if (!(p > 0)) return;
    n.sells.forEach(s => { const u = usualPrice(s.id); if (u != null) { const v = Math.max(1, Math.round(u * p / 100)); if (v === u) delete s.price; else s.price = v; } });
    re();
  };
  const pc = $("#pctClear"); if (pc) pc.onclick = () => { n.sells.forEach(s => delete s.price); re(); };
}

function showProblems(n) { const p = problemsOf(n); $("#problems").textContent = p.length ? "Check: " + p.join(" · ") : ""; }

// ---------------------------------------------------------------- live in game (NPCLoader's live link)
let G = { connected: false }, liveNpcs = [], liveTimer = null, liveFor = null;
const zoneOf = () => G.inWorld ? G.zone : null;

async function pollGame() {
  try { G = await (await fetch("/api/live/status")).json(); } catch (e) { G = { connected: false }; }
  const b = $("#live");
  if (G.connected && G.inWorld) { b.className = "badge on"; b.textContent = "● In game: " + zoneName(G.zone); }
  else if (G.connected) { b.className = "badge"; b.textContent = "● Game running, not in the world yet"; }
  else { b.className = "badge off"; b.textContent = "○ Game not running"; }
  const was = liveNpcs.length;
  if (G.connected && G.inWorld && (!liveNpcs.length || liveNpcs.zone !== G.zone || Date.now() - (liveNpcs.at || 0) > 20000)) {
    try { const r = await (await fetch("/api/live/npcs")).json(); liveNpcs = r.npcs || []; liveNpcs.zone = r.zone; liveNpcs.at = Date.now(); } catch (e) {}
  }
  if (!G.connected) liveNpcs = [];
  const box = $("#liveBox");
  const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (box && sel >= 0 && !typing && (box.dataset.state !== liveState() || was !== liveNpcs.length)) renderEditor();
  $("#gvHost").innerHTML = "";   // the 3D view is in the Build layout now
}

// ---------------------------------------------------------------- edits made in the game (build mode)
async function gameEdit(ev) {
  let i = pack.npcs.findIndex(n => n.id == ev.id);
  if (i < 0) {   // in another pack
    const where = (D.custom || []).find(n => n.cid == ev.id);
    if (!where || where.pack === packName) return;
    if (dirty) { status(`NPC ${ev.id} is in the pack "${where.pack}": save or discard this one first, then move it again.`, "bad"); return; }
    ensurePack(where.pack); await openPack(where.pack); i = pack.npcs.findIndex(n => n.id == ev.id);
    if (i < 0) return;
  }
  const n = pack.npcs[i];
  if (ev.type === "select") { sel = i; renderList(); renderEditor(); return; }
  if (ev.type === "copy") {   // Ctrl+D or the menu in the 3D view: a copy that follows the mouse
    const c = JSON.parse(JSON.stringify(n)); c.id = nextId(); c.name = String(n.name || "").replace(/ \(copy\)$/, "") + " (copy)"; c.x = r1(c.x + 1.5);
    pack.npcs.push(c); sel = pack.npcs.length - 1; setDirty(); renderList(); renderEditor(); announce();
    if (ev.carry && G.connected && G.inWorld) {
      clearTimeout(liveTimer);
      await liveSend("/api/live/npc", c);
      setTimeout(() => fetch("/api/live/world/carry?kind=npc&new=1&id=" + c.id, { method: "POST", body: "{}" }).catch(() => {}), 400);
    }
    return;
  }
  if (ev.type === "move") {
    for (const k of ["zone", "x", "y", "z", "rotation"]) if (ev[k] != null) n[k] = ev[k];
    sel = i; dirty = true; parent.postMessage({ dirty: true }, "*"); status("Moved in the game. Unsaved changes");
  }
  if (ev.type === "delete") {
    pack.npcs.splice(i, 1); sel = Math.min(sel, pack.npcs.length - 1);
    dirty = true; parent.postMessage({ dirty: true }, "*"); status(ev.cancel ? "Placing cancelled" : "Removed in the game. Unsaved changes (Discard changes brings it back)");
  }
  const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  renderList(); if (!typing) renderEditor();
  announce();
}
const liveState = () => (G.connected ? "c" : "") + (G.inWorld ? "w" : "") + (G.zone || "");

// Looks: with the game connected, the NPCs really standing in that zone (nearest first).
function lookChoices(n) {
  if (G.connected && G.inWorld && n.zone === G.zone && liveNpcs.length)
    return liveNpcs.filter(t => !t.custom && t.cid < FIRST_ID).map(t => ({ cid: t.cid, name: t.name, distance: t.distance }));
  const tpl = gameNpc(n.template);
  return npcsIn(n.zone).length ? npcsIn(n.zone) : (tpl ? [tpl] : []);
}

function liveBox(n) {
  const st = liveState();
  if (!G.connected) return `<fieldset class="livebox" id="liveBox" data-state="${st}"><legend>Live in game</legend>
      <p class="hint">Press ▶ Start at the top to open the 3D view: changes here then show up in it as you make them.</p></fieldset>`;
  if (!G.inWorld) return `<fieldset class="livebox" id="liveBox" data-state="${st}"><legend>Live in game</legend><p class="hint">The 3D view is still loading the world…</p></fieldset>`;
  const here = n.zone === G.zone;
  return `<fieldset class="livebox" id="liveBox" data-state="${st}"><legend>Live in game · ${esc(zoneName(G.zone))}</legend>
    ${here ? "" : `<p class="hint">${esc(n.name)} is in ${esc(zoneName(n.zone))}; you're in ${esc(zoneName(G.zone))}. Travel there in game to see it, or put it where you are.</p>`}
    <div class="liverow">
      <div class="col">
        <button class="primary" id="lvHere" title="2.5 m in front of you, facing you">Put here (in front of me)</button>
        <button id="lvGo" ${here ? "" : "disabled"}>Take me there</button>
        <button id="lvFace" ${here ? "" : "disabled"}>Turn to face me</button>
      </div>
      <div class="col"><span class="hint">Move (from where you face in game)</span>
        <div class="pad">
          <button data-turn="-15" title="Turn left">⟲</button><button data-move="0,1" title="Away from you">▲</button><button data-turn="15" title="Turn right">⟳</button>
          <button data-move="-1,0" title="Left">◀</button><button data-move="0,0" disabled>·</button><button data-move="1,0" title="Right">▶</button>
          <span></span><button data-move="0,-1" title="Towards you">▼</button><span></span>
        </div>
        <label class="checks" style="margin-top:2px"><label><input type="checkbox" id="lvBig">1 m steps</label></label>
      </div>
      <div class="col"><span class="hint">Look</span>
        <div class="row" style="margin:0"><button id="lvPrev" ${here ? "" : "disabled"}>◀ Previous</button><button id="lvNext" ${here ? "" : "disabled"}>Next ▶</button></div>
        <span class="hint">Flips through the people in this zone.</span>
      </div>
    </div>
    <p class="hint" id="liveNote">Changes show in the game right away. <b>Save</b> keeps them; <b>Discard changes</b> puts the game back.</p>
  </fieldset>`;
}

function wireLive(n) {
  const on = (id, f) => { const el = $("#" + id); if (el) el.onclick = f; };
  const changed = () => { setDirty(); renderList(); renderEditor(); };
  on("lvHere", async () => {
    try {
      const h = await (await fetch("/api/live/here")).json();
      if (!h.connected || h.error) return liveNote(h.error || "The game isn't connected.");
      n.zone = h.zone; n.x = h.x; n.y = h.y; n.z = h.z; n.rotation = h.rotation;
      if (!lookChoices(n).some(t => t.cid === n.template)) { const near = lookChoices(n)[0]; if (near) n.template = near.cid; }
      changed();
    } catch (e) { liveNote("Couldn't reach the game: " + e.message); }
  });
  on("lvGo", async () => { await liveSend("/api/live/goto", n); liveNote("Teleported you in front of " + n.name + "."); });
  on("lvFace", () => {
    const dx = G.x - n.x, dz = G.z - n.z;
    n.rotation = Math.round(((Math.atan2(dx, dz) * 180 / Math.PI) + 360) % 360);
    changed();
  });
  document.querySelectorAll("[data-turn]").forEach(b => b.onclick = () => { n.rotation = Math.round((((n.rotation || 0) + +b.dataset.turn) % 360 + 360) % 360); changed(); });
  document.querySelectorAll("[data-move]").forEach(b => b.onclick = () => {
    const [rx, fw] = b.dataset.move.split(",").map(Number), step = $("#lvBig") && $("#lvBig").checked ? 1 : 0.5;
    const a = (G.facing || 0) * Math.PI / 180;           // the player's facing: forward = away from you
    n.x = r1(n.x + (Math.sin(a) * fw + Math.cos(a) * rx) * step);
    n.z = r1(n.z + (Math.cos(a) * fw - Math.sin(a) * rx) * step);
    changed();
  });
  const cycle = d => {
    const looks = lookChoices(n); if (!looks.length) return;
    const i = looks.findIndex(t => t.cid === n.template);
    n.template = looks[((i < 0 ? 0 : i + d) + looks.length) % looks.length].cid;
    changed();
  };
  on("lvPrev", () => cycle(-1));
  on("lvNext", () => cycle(1));
}

function liveNote(t) { const el = $("#liveNote"); if (el) el.textContent = t; }

async function liveSend(url, data) {
  try {
    const r = await (await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: data ? JSON.stringify(data) : "" })).json();
    if (r.error) liveNote(r.error);
    return r;
  } catch (e) { liveNote("Couldn't reach the game: " + e.message); return {}; }
}

// Send the NPC being edited to the game (a moment after the last change).
function scheduleLive() {
  if (!G.connected || !G.inWorld || sel < 0 || !pack.npcs[sel]) return;
  liveFor = pack.npcs[sel];
  clearTimeout(liveTimer);
  liveTimer = setTimeout(async () => {
    const n = liveFor; if (!n) return;
    const r = await liveSend("/api/live/npc", n);
    if (r.ok && r.shown) liveNote(`Showing ${n.name} in the game. Save keeps it.`);
    else if (r.ok && !r.shown) liveNote(n.zone === G.zone ? `${n.name} is hidden (untick "in the world" to hide).` : `${n.name} is in another zone.`);
  }, 250);
}
function removeLive(id) { if (G.connected && G.inWorld) liveSend("/api/live/remove?id=" + id); }

// Discard: back to the pack on disk, and the game back to the saved packs.
$("#discard").onclick = async (confirmed) => {
  if (dirty && confirmed !== true && !confirm("Throw away your unsaved changes to the NPCs in " + packName + "? This can't be undone.")) return;
  dirty = false; parent.postMessage({ dirty: false }, "*");
  await openPack(packName);
  if (G.connected && G.inWorld) { await liveSend("/api/live/reload"); status("Changes thrown away; the game shows the saved NPCs again.", "ok"); }
  else status("Changes thrown away.", "ok");
};

setInterval(pollGame, 2500);
pollGame();


// ---------------------------------------------------------------- a pack that's switched off does nothing in the game: say so
function updateOffBar() {
  const bar = document.getElementById("offBar"); if (!bar) return;
  bar.hidden = !(D.packsOff || []).includes(packName);
}
document.getElementById("offOn").onclick = async () => {
  try {
    await api(`/api/packs/toggle?kind=npcs&name=${encodeURIComponent(packName)}&on=1`, { method: "POST" });
    D.packsOff = (D.packsOff || []).filter(n => n !== packName);
    fillPacks([...$("#packSel").options].map(o => o.value));
    updateOffBar();
    status("Switched on.", "ok");
    if (G.connected && G.inWorld) await fetch("/api/live/reload", { method: "POST", body: "{}" });
    parent.postMessage({ broadcast: { cmd: "packsChanged", kind: "npcs" } }, "*");
  } catch (e) { status("Couldn't switch it on: " + e.message, "bad"); }
};

// ---------------------------------------------------------------- save
async function save(quiet) {
  const bad = pack.npcs.map(n => [n, problemsOf(n)]).filter(x => x[1].length);
  if (!quiet && bad.length && !confirm(`${bad.length} NPC(s) have problems (e.g. ${bad[0][0].name}: ${bad[0][1][0]}). Save anyway?`)) return;
  pack.name = pack.name || packName;
  try {
    const r = await api("/api/npcs/pack?name=" + encodeURIComponent(packName), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pack) });
    setDirty(false); status(`Saved ${r.count} NPC(s)${r.enabled ? "" : " (pack is off)"}. The 3D view shows them; the game loads them next time you play.`, "ok");
    const fresh = await api("/api/npcs/data"); D.custom = fresh.custom; D.packs = fresh.packs; D.packsOff = fresh.packsOff; fillPacks(D.packs);
    parent.postMessage({ broadcast: { cmd: "npcsChanged" } }, "*");
    parent.postMessage({ broadcast: { cmd: "packsChanged", kind: "npcs" } }, "*");
  } catch (e) { status("Save failed: " + e.message, "bad"); }
}

let msgQueue = Promise.resolve();
window.addEventListener("message", e => { msgQueue = msgQueue.then(() => onMessage(e)).catch(err => status("Problem: " + err.message, "bad")); });
async function onMessage(e) {
  const m = e.data || {};
  if (m.cmd === "packsChanged" && m.kind === "npcs" && m.deleted === packName) {   // deleted on Packs & mods
    const left = ((await api("/api/overview")).packs.npcs || []).map(p => p.name);
    dirty = false; parent.postMessage({ dirty: false }, "*");
    D.packs = left; packName = null; fillPacks(left.length ? left : ["my-npcs"]);
    await openPack(left[0] || "my-npcs");
    return;
  }
  if (m.cmd === "openPack") { ensurePack(m.name); await openPack(m.name); }
  if (m.cmd === "newNpc") newNpc();
  if (m.cmd === "save" && pack && dirty) save();
  if (m.cmd === "discard" && pack && dirty) await $("#discard").onclick(m.confirmed);   // the Build toolbar's Discard (it asked)
  if (m.cmd === "gameEdit" && pack) await gameEdit(m.ev);   // one at a time (a drag sends many)
  if (m.cmd === "layout") { document.body.classList.toggle("compact", !!m.compact); if (pack) renderEditor(); }
  if (m.cmd === "newNpcAt" && !pack) return;
  if (m.cmd === "newNpcAt") {   // from the map
    const near = m.template ? (gameNpc(m.template) || { cid: m.template, zone: m.zone, x: m.x, y: m.y, z: m.z }) : null;
    newNpc(near, true);
    const n = pack.npcs[pack.npcs.length - 1];
    n.zone = m.zone; n.x = m.x; n.y = m.y; n.z = m.z;
    if (m.rotation != null) n.rotation = Math.round(m.rotation);
    if (m.template) n.template = m.template;
    if (m.name) n.name = "New " + m.name;
    if (!m.template && !npcsIn(n.zone).some(t => t.cid === n.template)) { const t = npcsIn(n.zone)[0]; if (t) n.template = t.cid; }
    setDirty(); renderList(); renderEditor();
    if (m.carry && G.connected && G.inWorld) {   // follow the mouse in the 3D view until you click
      clearTimeout(liveTimer);
      await liveSend("/api/live/npc", n);
      setTimeout(() => fetch("/api/live/world/carry?kind=npc&new=1&id=" + n.id, { method: "POST", body: "{}" }).catch(() => {}), 400);
    }
  }
  if (m.cmd === "select") {
    let i = pack.npcs.findIndex(n => n.id == m.id);
    if (i < 0) {   // in another pack
      const where = (D.custom || []).find(n => n.cid == m.id);
      if (where && where.pack !== packName) { ensurePack(where.pack); await openPack(where.pack); i = pack.npcs.findIndex(n => n.id == m.id); }
    }
    if (i >= 0) { sel = i; renderList(); renderEditor(); }
  }
  // The map saved a move straight to an NPC pack: take it in (or the next save here would undo it).
  if (m.cmd === "packsChanged" && m.kind === "npcs" && !m.deleted && m.pack === packName && pack) {
    const disk = await api("/api/npcs/pack?name=" + encodeURIComponent(packName)).catch(() => null);
    if (disk) {
      if (!dirty) { pack = disk; pack.npcs = pack.npcs || []; sel = Math.min(sel, pack.npcs.length - 1); }
      else if (m.id != null) { const d = (disk.npcs || []).find(n => n.id == m.id); const j = pack.npcs.findIndex(n => n.id == m.id); if (d && j >= 0) for (const k of ["zone", "x", "y", "z", "rotation"]) if (d[k] !== undefined) pack.npcs[j][k] = d[k]; }
      renderList(); if (!/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) renderEditor(); announce();
    }
  }
  if (m.cmd === "packsChanged" && m.kind !== "npcs") {
    const fresh = await api("/api/npcs/data");
    D.originals = fresh.originals; D.packQuests = fresh.packQuests; D.shops = fresh.shops; D.packsOff = fresh.packsOff;
    if (m.kind === "content") { D.items = fresh.items; D.itemNames = fresh.itemNames; D.vendorStock = fresh.vendorStock; D.icons = fresh.icons; loadItems(); }
    fillPacks(fresh.packs.length ? fresh.packs : [packName]); renderEditor();
  }
}

// Delete the open pack (it goes to the Recycle Bin), then open another one.
async function deletePack() {
  const exists = ((await api("/api/overview")).packs.npcs || []).some(p => p.name === packName);
  if (!confirm(exists ? `Delete the pack "${packName}"?\n\nIt goes to the Recycle Bin (or Mods\\.trash on a drive without one), so you can get it back.`
                      : `"${packName}" was never saved. Throw it away?`)) return;
  if (exists) {
    try { await api(`/api/packs/delete?kind=npcs&name=${encodeURIComponent(packName)}`, { method: "POST" }); }
    catch (e) { status("Couldn't delete: " + e.message, "bad"); return; }
  }
  const left = ((await api("/api/overview")).packs.npcs || []).map(p => p.name);
  dirty = false; parent.postMessage({ dirty: false }, "*");
  D.packs = left; D.packsOff = D.packsOff ? D.packsOff.filter(n => left.includes(n)) : [];
  const next = left[0] || "my-npcs";
  packName = null; fillPacks(left.length ? left : [next]);
  await openPack(next);
  status(exists ? "Deleted (it's in the Recycle Bin)" : "Thrown away", "ok");
  parent.postMessage({ broadcast: { cmd: "packsChanged", kind: "npcs" } }, "*");
}
$("#delPack").onclick = deletePack;
$("#save").onclick = () => save();
$("#newNpc").onclick = () => newNpc(sel >= 0 ? null : null);
$("#packSel").onchange = e => openPack(e.target.value);
$("#newPack").onclick = () => {
  const n = prompt("Name for the new pack (letters, numbers, spaces, - and _):", "my-npcs"); if (!n) return;
  ensurePack(n); openPack(n);
};
$("#search").oninput = renderList;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (document.body.classList.contains("compact")) parent.postMessage({ key: "ctrl-s" }, "*"); else save(); } });

// Ctrl+K goes to the search box in the main window.
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); parent.postMessage({ key: "ctrl-k" }, "*"); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
boot().then(() => parent.postMessage({ ready: true }, "*")).catch(e => { status("Couldn't load: " + e.message, "bad"); parent.postMessage({ ready: true, error: e.message }, "*"); });
</script>
</body>
