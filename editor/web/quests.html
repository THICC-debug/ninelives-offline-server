<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quests</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* "Defeat monsters" goals: the chosen enemy, and the enemy picker */
  .krow { align-items: center; }
  .kchip { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 200px; flex: 1; }
  .kchip.none { color: var(--muted); font-style: italic; padding: 8px 10px; }
  .kchip.bad { border-color: var(--bad); }
  .kchip b { display: block; }
  .kchip small { color: var(--muted); }
  .mpic { width: 40px; height: 40px; border-radius: 6px; background: var(--chip); object-fit: contain; flex: none; }
  .mpic.big { width: 132px; height: 132px; border-radius: 10px; }
  .mpic.none { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); font-size: 18px; }
  .mpic.big.none { font-size: 42px; }
  .mpic.none { flex-direction: column; } .mpic.none small { display: block; font-size: 10px; font-weight: 400; line-height: 1.3; padding: 4px 8px 0; text-align: center; }
  .krow details { flex-basis: 100%; order: 9; }
  .krow details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .mpick { border: 1px solid var(--accent); border-radius: 10px; padding: 10px; margin: 4px 0 12px; background: var(--bg); }
  .mp-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .mp-head label { display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .mp-head select { width: auto; }
  .mp-head input { flex: 1; min-width: 160px; }
  .mp-body { display: grid; grid-template-columns: minmax(230px, 1fr) minmax(280px, 1.4fr); gap: 10px; }
  .mp-list { display: flex; flex-direction: column; gap: 4px; max-height: min(760px, 78vh); overflow: auto; padding-right: 2px; }
  .mcard { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .mcard:hover { border-color: var(--muted); }
  .mcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .mcard .mn { font-weight: 600; }
  .mcard .ms { font-size: 11px; color: var(--muted); }
  .mcard .mz { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
  .mp-info { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  .mi-top { display: flex; gap: 12px; align-items: flex-start; }
  .mi-top h3 { margin: 0 0 2px; font-size: 17px; }
  .mi-top .sub { color: var(--muted); font-size: 12px; }
  .mstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; margin-top: 8px; }
  .mstats div { background: var(--chip); border-radius: 6px; padding: 3px 7px; font-size: 12px; }
  .mstats div span { color: var(--muted); display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
  .mstats div b { font-size: 13px; }
  .mmap { position: relative; margin-top: 10px; }
  .mmap svg { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background: #20262b; }
  .mmap .tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
  .mmap .tools button { padding: 2px 8px; font-size: 12px; }
  .mmap .legend { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .mmap .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 8px; }
  .nomap { padding: 30px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; margin-top: 10px; font-size: 12px; }
  .ping { animation: ping 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  .mi-use { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 720px) { .mp-body { grid-template-columns: 1fr; } .mp-list { max-height: 260px; } .mpic.big { width: 88px; height: 88px; } }
</style>
</head>
<body>
<header>
  <label style="color:var(--ink)">Pack <select id="packSel"></select></label>
  <button id="newPack">New pack</button>
  <button id="save" class="primary" title="Ctrl+S">Save pack</button>
  <button id="delPack" class="danger" title="Delete this pack (to the Recycle Bin)">Delete pack</button>
  <span id="status">Loading…</span>
</header>
<main>
  <aside>
    <div class="tabs"><button id="tabPack" class="on">My pack</button><button id="tabOrig">Original quests</button></div>
    <input id="search" placeholder="Search title, id, NPC…">
    <div id="list"></div>
  </aside>
  <section id="editor"></section>
</main>
<datalist id="itemList"></datalist>
<datalist id="npcList"></datalist>
<datalist id="flagList"></datalist>

<script src="/monsters.js"></script>
<script>
const TYPES = ["Normal","Daily","Repeatable","Seasonal","Errand","Kill","Collect","Defence","Message","ItemReceive","TimeAttack","Main"];
const FIRST_MOD_ID = 900000001, FIRST_MOD_FLAG = 9000;
let D = { originals: [], items: [], npcs: [], packs: [] };
let pack = null, packName = null, tab = "pack", sel = null, dirty = false;
const itemName = {}, npcName = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function status(msg, cls) { const s = $("#status"); s.textContent = msg; s.className = cls || ""; }
function setDirty(v = true) { dirty = v; status(v ? "Unsaved changes" : "Saved", v ? "" : "ok"); parent.postMessage({ dirty: v }, "*"); }

async function api(path, opts) {
  const r = await fetch(path, opts); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

async function boot() {
  D = await api("/api/quests/data");
  D.items.forEach(i => itemName[i.id] = i.name);
  loadMonsters();
  $("#itemList").innerHTML = D.items.map(i => `<option value="${i.id} · ${esc(i.name)}">`).join("");
  buildNpcs();
  buildFlags();
  const packs = D.packs.length ? D.packs : ["my-quests"];
  fillPacks(packs);
  await openPack(packs.find(p => !(D.packsOff || []).includes(p)) || packs[0]);
  if (!D.originals.length) status("No exported quests yet: play once with QuestLoader installed, then reload.", "bad");
}

// Pack picker; packs switched off on Packs & mods are marked.
function fillPacks(names) {
  if (packName && !names.includes(packName)) names = [...names, packName];   // (a new pack, not saved yet)
  const off = new Set(D.packsOff || []);
  $("#packSel").innerHTML = names.map(p => `<option value="${esc(p)}">${esc(p)}${off.has(p) ? " (off)" : ""}</option>`).join("");
  if (packName) $("#packSel").value = packName;
}
function ensurePack(n) { if (![...$("#packSel").options].some(o => o.value === n)) $("#packSel").insertAdjacentHTML("beforeend", `<option value="${esc(n)}">${esc(n)}</option>`); $("#packSel").value = n; }

// Messages from the other tabs.
window.addEventListener("message", async e => {
  const m = e.data || {};
  if (m.cmd === "packsChanged" && m.kind === "quests" && m.deleted === packName) {   // deleted on Packs & mods
    const left = ((await api("/api/overview")).packs.quests || []).map(p => p.name);
    dirty = false; parent.postMessage({ dirty: false }, "*");
    D.packs = left; packName = null; fillPacks(left.length ? left : ["my-quests"]);
    await openPack(left[0] || "my-quests");
    return;
  }
  if (m.cmd === "openPack") { if (m.name !== packName) { ensurePack(m.name); if (await openPack(m.name) === false) return; } if (m.then) window.postMessage(m.then, "*"); }
  if (m.cmd === "browseOriginals") { tab = "orig"; sel = null; renderList(); renderEditor(); $("#search").focus(); }
  if (m.cmd === "search") { tab = "orig"; $("#search").value = m.q || ""; renderList(); }
  if (m.cmd === "select") {
    const mine = pack.quests.findIndex(q => q.id == m.id);
    if (mine >= 0) { tab = "pack"; sel = { tab, i: mine }; }
    else { const o = D.originals.findIndex(q => q.id == m.id); if (o >= 0) { tab = "orig"; sel = { tab, i: o }; } }
    $("#search").value = ""; renderList(); renderEditor();
    const el = document.querySelector("#list .item.sel"); if (el) el.scrollIntoView({ block: "center" });
  }
  if (m.cmd === "newQuest") {
    newQuest();
    const q = pack.quests[pack.quests.length - 1];
    if (m.giver) { q.giver = q.ender = m.giver; const who = D.npcs.find(n => n.cid === m.giver); q.title = "New quest from " + (who ? who.name.replace(" (custom)", "") : m.giver); }
    renderList(); renderEditor();
  }
  if (m.cmd === "packsChanged" || m.cmd === "npcsChanged") {
    const fresh = await api("/api/quests/data");
    D.packs = fresh.packs; D.packsOff = fresh.packsOff; D.npcs = fresh.npcs; D.monsters = fresh.monsters; D.maps = fresh.maps; loadMonsters();
    buildNpcs(); fillPacks(D.packs.length ? D.packs : [packName]);
  }
});

function buildNpcs() {
  const uses = {};
  D.originals.forEach(q => [q.giver, q.ender].forEach(c => { if (c > 0) (uses[c] = uses[c] || new Set()).add(q.title); }));
  const byCid = {};
  D.npcs.forEach(n => { (byCid[n.cid] = byCid[n.cid] || []).push(n); });
  const cids = new Set([...Object.keys(uses), ...Object.keys(byCid)].map(Number));
  const opts = [];
  [...cids].sort((a, b) => a - b).forEach(c => {
    const seen = byCid[c] ? byCid[c].map(n => `${n.name || "?"} (${(n.zone || "").replace("Zone_", "")})`).join(", ") : null;
    const q = uses[c] ? [...uses[c]].slice(0, 3).join(" / ") : null;
    const label = seen || ("quests: " + q);
    npcName[c] = label;
    opts.push(`<option value="${c} · ${esc(label)}">`);
  });
  $("#npcList").innerHTML = opts.join("");
}

// ---------------------------------------------------------------- flags
// The game's progress flags are mostly "this quest is done" markers: each quest sets its clearFlag.
// Work out what every flag number means from the original quests (and this pack's quests).
let flagInfo = {};
function buildFlags() {
  flagInfo = {};
  const add = (f, text) => { if (f > 0) (flagInfo[f] = flagInfo[f] || []).push(text); };
  D.originals.forEach(q => {
    add(q.clearFlag, `"${q.title}" done`);
    (q.setFlagsOnClear || []).forEach(s => add(s.flag, `${s.on ? "set" : "cleared"} by finishing "${q.title}"`));
  });
  if (pack) pack.quests.forEach(q => add(q.clearFlag, `your quest "${q.title}" done`));
  const opts = Object.keys(flagInfo).map(Number).sort((a, b) => a - b)
    .map(f => `<option value="${f} · ${esc(flagInfo[f][0])}">`);
  $("#flagList").innerHTML = opts.join("");
}
function flagLabel(f) {
  if (!(f > 0)) return "";
  if (flagInfo[f]) return flagInfo[f].join("; ");
  return f >= 9000 && f <= 9999 ? "mod flag (9000–9999), not used by the game" : "not a quest flag (may be used by the world itself)";
}

async function openPack(name) {
  if (dirty && !confirm("Discard unsaved changes?")) { $("#packSel").value = packName; return false; }
  pack = await api("/api/quests/pack?name=" + encodeURIComponent(name));
  ensurePack(name);   // the picker shows the pack that is open
  pack.quests = pack.quests || []; packName = name; sel = null; dirty = false; parent.postMessage({ dirty: false }, "*");
  buildFlags();
  status(`Pack "${name}": ${pack.quests.length} quest(s)`);
  renderList(); renderEditor();
  return true;
}

// ---------------------------------------------------------------- list
function renderList() {
  $("#tabPack").textContent = `My pack (${pack.quests.length})`;
  $("#tabOrig").textContent = `Original quests (${D.originals.length})`;
  $("#tabPack").classList.toggle("on", tab === "pack"); $("#tabOrig").classList.toggle("on", tab === "orig");
  const term = $("#search").value.trim().toLowerCase();
  const src = tab === "pack" ? pack.quests : D.originals;
  const origIds = new Set(D.originals.map(q => q.id));
  const html = [];
  src.forEach((q, i) => {
    const hay = `${q.id} ${q.title} ${npcName[q.giver] || ""} ${q.description || ""}`.toLowerCase();
    if (term && !hay.includes(term)) return;
    const on = sel && sel.tab === tab && sel.i === i;
    const tag = tab === "pack" && origIds.has(q.id) ? '<span class="badge warn">replaces original</span>' : "";
    html.push(`<div class="item${on ? " sel" : ""}" data-i="${i}"><b>${esc(q.title || "(untitled)")}</b>${tag}
      <small>#${q.id} · from ${esc(npcName[q.giver] || q.giver || "no NPC")}</small></div>`);
  });
  $("#list").innerHTML = html.join("") || `<div class="empty">${tab === "pack" ? "No quests in this pack yet." : "Nothing matches."}</div>`;
  $("#list").querySelectorAll(".item").forEach(el => el.onclick = () => { sel = { tab, i: +el.dataset.i }; renderList(); renderEditor(); });
}


// ---------------------------------------------------------------- enemies (for "Defeat monsters" goals)
// ContentLoader 1.4 writes every monster kind met in a zone: stats, where it was seen and a picture.
let MON = [], picker = null, pickedZone = {};   // pickedZone: name -> the zone it was picked from (this session)   // picker: { q, row, zone, term, sel, whole }
function loadMonsters() { MON = mergeMonsters(D.monsters); }
const monZones = () => [...new Set(MON.map(m => m.zone))].sort();
const monsIn = z => MON.filter(m => m.zone === z).sort((a, b) => a.name.localeCompare(b.name));
const giverZone = q => { const n = D.npcs.find(n => n.cid === q.giver); return n ? n.zone : null; };
function monOf(r, q) {   // the known monster a goal points at
  const gz = q ? giverZone(q) : null;
  const byName = MON.filter(m => r.monster && m.name === r.monster);
  if (byName.length) return byName.find(m => m.zone === pickedZone[r.monster]) || byName.find(m => m.zone === gz) || byName.slice().sort((a, b) => (b.spots || []).length - (a.spots || []).length)[0];
  return !r.monster && r.monsterId > 0 ? MON.find(m => m.cid === r.monsterId) : null;
}
function miniMap(m, q, whole) {
  const B = (D.maps || {})[m.zone], spots = m.spots || [];
  if (!B && !spots.length) return `<div class="nomap">Not placed on the map yet. Walk around ${esc(zoneName(m.zone))} with ContentLoader 1.4 and it gets placed.</div>`;
  let x0, z0, side;
  if (B && (whole || !spots.length)) { x0 = B.minX; z0 = B.minZ; side = Math.max(B.maxX - B.minX, B.maxZ - B.minZ); }
  else {
    const xs = spots.map(p => p[0]), zs = spots.map(p => p[1]);
    const a = Math.min(...xs) - 90, b = Math.max(...xs) + 90, c = Math.min(...zs) - 90, d = Math.max(...zs) + 90;
    side = Math.max(320, b - a, d - c); x0 = (a + b) / 2 - side / 2; z0 = (c + d) / 2 - side / 2;
    if (B) { side = Math.min(side, Math.max(B.maxX - B.minX, B.maxZ - B.minZ)); x0 = Math.max(B.minX, Math.min(x0, B.maxX - side)); z0 = Math.max(B.minZ, Math.min(z0, B.maxZ - side)); }
  }
  const u = side / 300;   // one pixel of a 300 px map, in metres
  const parts = [];
  if (B) parts.push(`<image href="/api/map/image?zone=${encodeURIComponent(m.zone)}" x="${B.minX}" y="${-B.maxZ}" width="${B.maxX - B.minX}" height="${B.maxZ - B.minZ}" preserveAspectRatio="none"/>`);
  else for (let g = Math.ceil(x0 / 100) * 100; g < x0 + side; g += 100) parts.push(`<line x1="${g}" y1="${-z0 - side}" x2="${g}" y2="${-z0}" stroke="#39424a" stroke-width="${u}"/>`);
  if (!B) for (let g = Math.ceil(z0 / 100) * 100; g < z0 + side; g += 100) parts.push(`<line x1="${x0}" y1="${-g}" x2="${x0 + side}" y2="${-g}" stroke="#39424a" stroke-width="${u}"/>`);
  const hot = hotspots(spots);
  hot.forEach(h => parts.push(`<circle cx="${h.x}" cy="${-h.z}" r="${Math.max(h.r, 9 * u)}" fill="rgba(255,90,80,.16)" stroke="#ff5a50" stroke-width="${1.5 * u}" stroke-dasharray="${4 * u} ${3 * u}"/>`));
  spots.forEach(([x, z]) => parts.push(`<circle cx="${x}" cy="${-z}" r="${2.2 * u}" fill="#ff6b5e" stroke="#000" stroke-width="${0.6 * u}"/>`));
  const g = q && D.npcs.find(n => n.cid === q.giver && n.zone === m.zone && n.x != null);
  if (g) parts.push(`<circle cx="${g.x}" cy="${-g.z}" r="${5 * u}" fill="#f2c14e" stroke="#000" stroke-width="${u}"><title>${esc(g.name)} (gives the quest)</title></circle>`);
  hot.forEach((h, i) => parts.push(`<circle class="ping" cx="${h.x}" cy="${-h.z}" r="${12 * u}" fill="none" stroke="#fff" stroke-width="${2 * u}"/>`,
    `<g transform="translate(${h.x} ${-h.z})"><title>${i ? "Also many here" : "Mostly here"} (${h.n} sightings)</title><path d="M0 0 L${-7 * u} ${-13 * u} A${8 * u} ${8 * u} 0 1 1 ${7 * u} ${-13 * u} Z" fill="#ff3b30" stroke="#000" stroke-width="${u}"/>` +
    `<text y="${-15 * u}" text-anchor="middle" font-size="${10 * u}" font-weight="700" fill="#fff">${i + 1}</text></g>`));
  return `<div class="mmap"><svg viewBox="${x0} ${-(z0 + side)} ${side} ${side}" xmlns="http://www.w3.org/2000/svg">${parts.join("")}</svg>
    <div class="tools">${B && spots.length ? `<button data-mp="whole">${whole ? "Zoom to them" : "Whole zone"}</button>` : ""}</div>
    <div class="legend">${!spots.length ? "Not placed yet: they're placed as you meet them in game (ContentLoader 1.4)." : ""}${spots.length ? `<i style="background:#ff3b30"></i>mostly here${hot.length > 1 ? " (" + hot.length + " places)" : ""}<i style="background:#ff6b5e"></i>seen (${spots.length} spots)` : ""}${g ? '<i style="background:#f2c14e"></i>quest giver' : ""}${B ? "" : " · no map picture of this zone yet"}</div></div>`;
}

function monInfo(m, q, r) {
  if (!m) return `<div class="nomap">Pick an enemy on the left to see it here.</div>`;
  const s = m.stats || {};
  const stats = STATROWS.map(([t, f]) => { const v = f(s); return v ? `<div><span>${t}</span><b>${esc(v)}</b></div>` : ""; }).join("");
  const elsewhere = MON.filter(o => o.name === m.name && o.zone !== m.zone).map(o => zoneName(o.zone));
  const chosen = r && r.monster === m.name;
  return `<div class="mi-top">${mpic(m, true)}<div style="min-width:0">
      <h3>${esc(m.name)} ${levelBadge(levelOf(m.stats, MON))}</h3>${m.title ? `<div class="sub">${esc(m.title)}</div>` : ""}
      <div class="sub">${esc(zoneName(m.zone))} · up to ${m.seen || 0} at once · loot table${m.drops.length > 1 ? "s" : ""} #${m.drops.join(", #")}${m.cid > 0 ? " · id " + m.cid : ""}</div>
      ${elsewhere.length ? `<div class="sub">Also lives in ${esc(elsewhere.join(", "))}</div>` : ""}
    </div></div>
    ${stats ? `<div class="mstats">${stats}</div>` : `<p class="hint">No stats yet: they're read the next time you're near one in game.</p>`}
    ${miniMap(m, q, picker && picker.whole)}
    <div class="mi-use"><button class="primary" data-mp="use" ${chosen ? "disabled" : ""}>${chosen ? "✓ This is the enemy" : `Defeat ${r ? r.count : ""} × ${esc(m.name)}`}</button>
      <span class="hint">Any "${esc(m.name)}" counts, in any zone. Double-click a card to pick it.</span></div>`;
}

function pickerHtml(q, r) {
  const zones = monZones();
  if (!zones.length) return `<div class="mpick"><p style="margin:0 0 6px"><b>No enemies known yet</b></p>
    <p class="hint">ContentLoader 1.4 lists the enemies of each zone as you meet them: start the game, walk around a zone, then come back here. You can still type a name in the row above.</p>
    <button data-mp="close">Close</button></div>`;
  return `<div class="mpick">
    <div class="mp-head"><label>Zone <select data-mp="zone">${zones.map(z => `<option value="${esc(z)}" ${z === picker.zone ? "selected" : ""}>${esc(zoneName(z))} (${monsIn(z).length})</option>`).join("")}</select></label>
      <input data-mp="term" placeholder="Search enemies in every zone…" value="${esc(picker.term)}">
      <button data-mp="close">Close</button></div>
    <div class="mp-body"><div class="mp-list" id="mpList"></div><div class="mp-info" id="mpInfo"></div></div></div>`;
}
function pickerList() {
  const t = picker.term.trim().toLowerCase();
  const list = t ? MON.filter(m => (m.name + " " + (m.title || "")).toLowerCase().includes(t)).sort((a, b) => a.name.localeCompare(b.name) || a.zone.localeCompare(b.zone)) : monsIn(picker.zone);
  return list.map(m => { const k = MON.indexOf(m), on = picker.sel === k;
    return `<div class="mcard${on ? " on" : ""}" data-mk="${k}">${mpic(m)}<div style="min-width:0"><div class="mn">${esc(m.name)} ${levelBadge(levelOf(m.stats, MON), true)}${m.shownAs ? ` <small class="hint" title="An enemy pack renames it in game; kills still count under this name">shown as “${esc(m.shownAs)}”</small>` : ""}</div><div class="ms">${esc(shortStats(m))}</div></div>
      <div class="mz">${t ? esc(zoneName(m.zone)) + "<br>" : ""}${(m.spots || []).length ? "📍 " + (m.spots || []).length : ""}</div></div>`; }).join("")
    || `<p class="hint">${t ? "No enemy matches." : "None seen in this zone."}</p>`;
}
function wirePicker(box, q, r) {
  const el = box.querySelector(".mpick"); if (!el) return;
  const use = m => { if (!m) return; pickedZone[m.name] = m.zone; r.monster = m.name; r.monsterId = 0; picker = null; setDirty(); renderEditor(); };
  const wireInfo = () => {
    const u = el.querySelector('[data-mp="use"]'); if (u) u.onclick = () => use(MON[picker.sel]);
    const w = el.querySelector('[data-mp="whole"]'); if (w) w.onclick = () => { picker.whole = !picker.whole; info(); };
  };
  const info = () => { const i = el.querySelector("#mpInfo"); if (i) { i.innerHTML = monInfo(MON[picker.sel], q, r); wireInfo(); } };
  const list = () => { const l = el.querySelector("#mpList"); if (!l) return;
    l.innerHTML = pickerList();
    l.querySelectorAll("[data-mk]").forEach(c => {
      c.onclick = () => { picker.sel = +c.dataset.mk; picker.whole = false; l.querySelectorAll(".mcard").forEach(x => x.classList.toggle("on", x === c)); info(); };
      c.ondblclick = () => use(MON[+c.dataset.mk]);
    }); };
  el.querySelector('[data-mp="close"]').onclick = () => { picker = null; renderEditor(); };
  const z = el.querySelector('[data-mp="zone"]');

}
function openPicker(q, i) {
  const r = q.targets[i], cur = monOf(r, q), zones = monZones(), gz = giverZone(q);
  const zone = cur ? cur.zone : zones.includes(gz) ? gz : zones.slice().sort((a, b) => monsIn(b).length - monsIn(a).length)[0];
  const first = cur || monsIn(zone)[0];
  picker = { q, row: i, zone, term: "", sel: first ? MON.indexOf(first) : null, whole: false };
  renderEditor();
  const el = document.querySelector(".mpick"); if (el) el.scrollIntoView({ block: "nearest" });
}
function killRow(r, i, q, ro, dis) {
  const m = monOf(r, q);
  const unknown = r.monster && MON.length && !m;
  const chip = m ? `<div class="kchip">${mpic(m)}<div style="min-width:0"><b>${esc(m.name)}</b><small>${esc(zoneName(m.zone))} · ${esc(shortStats(m))}${m.shownAs ? ` · shown in game as “${esc(m.shownAs)}”` : ""}</small></div></div>`
    : r.monster ? `<div class="kchip${unknown ? " bad" : ""}">${mpic({ name: r.monster })}<div><b>${esc(r.monster)}</b><small>${unknown ? "no enemy seen with exactly this name" : "not seen in game yet"}</small></div></div>`
    : r.monsterId > 0 ? `<div class="kchip">${mpic({ name: "#" })}<div><b>Monster id ${r.monsterId}</b><small>matched by id</small></div></div>`
    : `<div class="kchip none">No enemy picked yet</div>`;
  const open = picker && picker.q === q && picker.row === i;
  return `Defeat <input class="num" type="number" min="1" data-f="count" value="${r.count}" ${dis}> × ${chip}
    ${ro ? "" : `<button data-pickmon="${i}" class="${open ? "" : "primary"}">${open ? "Hide enemies" : m || r.monster ? "Change enemy" : "Choose enemy…"}</button>`}
    ${ro ? "" : `<details><summary>Type a name or id instead</summary><div class="row">
      Name <input data-f="monster" value="${esc(r.monster)}" placeholder="exact name, e.g. Banded Yerlbok">
      or id <input class="num" type="number" data-f="monsterId" value="${r.monsterId || 0}">
      <span class="hint">The name must match exactly (capital letters too). The id is only used when the name is empty.</span></div></details>`}`;
}

// ---------------------------------------------------------------- helpers
// New quests and flags get numbers no pack uses, this one or any other (D.taken), so packs and shared mods don't clash.
const others = () => ((D.taken || {}).packs || []).filter(p => p.pack !== packName);
function nextId() {
  // (quest numbers the game has seen from another pack count too: a player's save may still hold them)
  const known = ((D.taken || {}).known || []).filter(k => k.pack.toLowerCase() !== (packName + ".json").toLowerCase()).map(k => k.id);
  const ids = [...pack.quests.map(q => q.id), ...others().flatMap(p => p.quests), ...known].filter(i => i >= FIRST_MOD_ID);
  return ids.length ? Math.max(...ids) + 1 : FIRST_MOD_ID;
}
function nextFlag() {
  const used = new Set([...pack.quests.flatMap(q => [q.clearFlag || 0, ...(q.setFlagsOnClear || []).map(f => f.flag)]), ...others().flatMap(p => p.flags)]);
  const top = Math.max(FIRST_MOD_FLAG - 1, ...[...used].filter(f => f >= FIRST_MOD_FLAG && f <= 9999)) + 1;
  if (top <= 9999) return top;
  for (let f = FIRST_MOD_FLAG; f <= 9999; f++) if (!used.has(f)) return f;   // all used up to 9999: the first gap
  return top;
}
const pickVal = (id, names) => id ? `${id} · ${names[id] || "?"}` : "";
const parseId = v => { const m = String(v).match(/^\s*(-?\d+)/); return m ? +m[1] : 0; };
const clone = o => JSON.parse(JSON.stringify(o));

function newQuest() {
  const q = { id: nextId(), title: "New quest", objective: "", types: ["Normal", "Collect"], enabled: true,
    giver: 0, ender: 0, description: "", descriptionForEnder: "", targets: [], rewards: [{ kind: "exp", amount: 100 }], clearFlag: nextFlag() };
  pack.quests.push(q); tab = "pack"; sel = { tab, i: pack.quests.length - 1 }; setDirty(); renderList(); renderEditor();
}

function copyOriginal(q, keepId) {
  const c = clone(q);
  if (!keepId) { c.id = nextId(); c.clearFlag = nextFlag(); c.title = q.title + " (copy)"; }
  const existing = pack.quests.findIndex(x => x.id === c.id);
  if (existing >= 0) pack.quests[existing] = c; else pack.quests.push(c);
  tab = "pack"; sel = { tab, i: existing >= 0 ? existing : pack.quests.length - 1 }; setDirty(); renderList(); renderEditor();
}

function renderRows(key, q, ro) {
  const box = $("#" + key); const rows = q[key] || []; const dis = ro ? "disabled" : "";
  box.innerHTML = rows.map((r, i) => {
    let inner = "";
    if (key === "targets" && r.kind === "kill")
      inner = killRow(r, i, q, ro, dis);
    else if (key === "targets")
      inner = `Bring <input class="num" type="number" data-f="count" value="${r.count}" ${dis}>
        × <input class="item-pick" list="itemList" data-f="item" data-pick="item" value="${esc(pickVal(r.item, itemName))}" placeholder="type an item name" ${dis}>
        <label style="display:inline-flex;gap:4px;color:var(--ink)"><input type="checkbox" data-f="includeBank" ${r.includeBank ? "checked" : ""} ${dis}>counts bank</label>`;
    else if (key === "rewards")
      inner = `<select data-f="kind" ${dis}>${["exp","gold","item"].map(k => `<option ${r.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select>
        <input class="num" type="number" data-f="amount" value="${r.amount}" ${dis}>
        ${r.kind === "item" ? `× <input class="item-pick" list="itemList" data-f="item" data-pick="item" value="${esc(pickVal(r.item, itemName))}" placeholder="type an item name" ${dis}>` : ""}`;
    else
      inner = `<input class="num" type="number" data-f="count" value="${r.count}" ${dis}>
        × <input class="item-pick" list="itemList" data-f="item" data-pick="item" value="${esc(pickVal(r.item, itemName))}" placeholder="type an item name" ${dis}>`;
    const pick = key === "targets" && !ro && picker && picker.q === q && picker.row === i ? pickerHtml(q, r) : "";
    return `<div class="row${key === "targets" && r.kind === "kill" ? " krow" : ""}" data-row="${i}">${inner}${ro ? "" : ` <button class="danger" data-rm="${i}" title="Remove">✕</button>`}</div>${pick}`;
  }).join("") || '<p class="hint">None.</p>';
  if (ro) return;
  if (key === "targets") {
    box.querySelectorAll("[data-pickmon]").forEach(b => b.onclick = () => { const i = +b.dataset.pickmon; if (picker && picker.q === q && picker.row === i) { picker = null; renderEditor(); } else openPicker(q, i); });
    if (picker && picker.q === q) wirePicker(box, q, rows[picker.row]);
  }
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { rows.splice(+b.dataset.rm, 1); if (picker && picker.q === q) picker = null; setDirty(); renderEditor(); });
  box.querySelectorAll("[data-f]").forEach(el => el.onchange = () => {
    const r = rows[+el.closest("[data-row]").dataset.row], f = el.dataset.f;
    if (key === "targets" && (f === "monster" || f === "monsterId")) { r[f] = f === "monsterId" ? (+el.value || 0) : el.value.trim(); setDirty(); renderEditor(); return; }
    if (el.type === "checkbox") r[f] = el.checked;
    else if (el.dataset.pick) r[f] = parseId(el.value);
    else if (el.type === "number") r[f] = +el.value || 0;
    else r[f] = el.value;
    // Switching reward kind: item counts start at 1, gold/exp amounts at 100.
    if (f === "kind") { r.amount = r.kind === "item" ? 1 : 100; if (r.kind !== "item") delete r.item; }
    setDirty(); if (f === "kind") renderEditor(); else showProblems(q);
  });
}

function flagLabelMap() { const m = {}; Object.keys(flagInfo).forEach(f => m[f] = flagInfo[f][0]); return m; }

function otherReqJson(q) {
  if (!q.requires) return "";
  const { flagsAll, itemsAll, ...other } = q.requires;
  const keep = {}; Object.keys(other).forEach(k => { if (other[k] && other[k].length) keep[k] = other[k]; });
  return Object.keys(keep).length ? JSON.stringify(keep, null, 1) : "";
}

// Requirement flags ("only after X") and flags set on clear, as readable rows.
function renderFlagRows(boxId, q, ro, mode) {
  const box = $("#" + boxId), dis = ro ? "disabled" : "";

  const opts = mode === "req" ? [["true", "Only after"], ["false", "Only before"]] : [["true", "Mark done:"], ["false", "Mark NOT done:"]];
  box.innerHTML = rows.map((r, i) => `<div class="row" data-row="${i}">
      <select data-f="on" ${dis}>${opts.map(([v, t]) => `<option value="${v}" ${String(!!r.on) === v ? "selected" : ""}>${t}</option>`).join("")}</select>
      <input class="item-pick" list="flagList" data-f="flag" value="${esc(pickVal(r.flag, flagLabelMap()))}" placeholder="type a quest name or flag number" ${dis}>
      ${mode === "req" ? "is done" : ""}

      <span class="hint" style="flex-basis:100%">${esc(flagLabel(r.flag))}</span></div>`).join("") || (ro ? '<p class="hint">None.</p>' : "");
  if (ro) return;

  box.querySelectorAll("[data-f]").forEach(el => el.onchange = () => {
    const r = rows[+el.closest("[data-row]").dataset.row];

function renderReqItems(q, ro) {
  const box = $("#reqItems"), dis = ro ? "disabled" : "";
  const rows = (q.requires && q.requires.itemsAll) || [];
  box.innerHTML = rows.map((r, i) => `<div class="row" data-row="${i}">
      Player has <select data-f="atLeast" ${dis}><option value="true" ${r.atLeast !== false ? "selected" : ""}>at least</option><option value="false" ${r.atLeast === false ? "selected" : ""}>fewer than</option></select>
      <input class="num" type="number" data-f="count" value="${r.count}" ${dis}>
      × <input class="item-pick" list="itemList" data-f="item" value="${esc(pickVal(r.item, itemName))}" placeholder="type an item name" ${dis}>
      <label style="display:inline-flex;gap:4px;color:var(--ink)"><input type="checkbox" data-f="includeBank" ${r.includeBank ? "checked" : ""} ${dis}>counts bank</label>
      ${ro ? "" : `<button class="danger" data-rm="${i}" title="Remove">✕</button>`}</div>`).join("");

// Drop empty lists so saved packs stay tidy.
function tidy(q) {
  if (q.requires) {
    Object.keys(q.requires).forEach(k => { if (!q.requires[k] || !q.requires[k].length) delete q.requires[k]; else if (k.startsWith("flags") || k.startsWith("workFlags")) q.requires[k] = q.requires[k].filter(f => f.flag > 0); });
    Object.keys(q.requires).forEach(k => { if (!q.requires[k].length) delete q.requires[k]; });
    if (!Object.keys(q.requires).length) delete q.requires;
  }
  if (q.setFlagsOnClear) { q.setFlagsOnClear = q.setFlagsOnClear.filter(f => f.flag > 0); if (!q.setFlagsOnClear.length) delete q.setFlagsOnClear; }
  ["targets", "rewards", "receives"].forEach(k => { if (q[k] && !q[k].length) delete q[k]; });
}

// ---------------------------------------------------------------- checks & save
function problemsOf(q) {
  const p = [];
  if (!q.title) p.push("needs a title");
  if (!(q.giver > 0)) p.push("needs an NPC who gives it");
  if (!(q.ender > 0)) p.push("needs an NPC to hand it in to");
  (q.targets || []).forEach(t => { if (t.kind === "item" && !itemName[t.item]) p.push("a goal has an unknown item"); });
  (q.targets || []).forEach(t => {
    if (t.kind !== "kill") return;
    if (!t.monster && !(t.monsterId > 0)) p.push("a defeat goal has no enemy picked");
    else if (t.monster && MON.length && !MON.some(m => m.name === t.monster)) p.push(`no enemy seen is called exactly "${t.monster}"`);
    if (!(t.count > 0)) p.push("a defeat goal needs a count of 1 or more");
  });
  if ((q.targets || []).some(t => t.kind === "kill") && (q.targets || []).some(t => t.kind !== "kill"))
    p.push("don't mix Bring items and Defeat monsters in one quest: the game stops counting kills (make two quests)");
  if ((q.targets || []).some(t => t.kind === "item") && !(q.types || []).includes("Collect"))
    p.push("item goals need the Collect type (QuestLoader adds it for you in game)");
  (q.rewards || []).forEach(r => { if (r.kind === "item" && !itemName[r.item]) p.push("a reward has an unknown item"); });
  if (pack.quests.filter(x => x.id === q.id).length > 1) p.push("id " + q.id + " is used twice in this pack");
  return p;
}
function showProblems(q) { const el = $("#problems"); if (el) el.textContent = problemsOf(q).length ? "Check: " + problemsOf(q).join(" · ") : ""; }

async function save() {
  const bad = pack.quests.map(q => [q, problemsOf(q)]).filter(x => x[1].length);
  if (bad.length && !confirm(`${bad.length} quest(s) have problems (e.g. "${bad[0][0].title}": ${bad[0][1][0]}). Save anyway?`)) return;
  pack.name = pack.name || packName;
  pack.quests.forEach(tidy);
  buildFlags();
  try {
    const r = await api("/api/quests/pack?name=" + encodeURIComponent(packName), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pack) });
    setDirty(false); status(`Saved ${r.count} quest(s)${r.enabled ? "" : " (pack is off)"}. The game loads them next time it starts.`, "ok");
    parent.postMessage({ broadcast: { cmd: "packsChanged", kind: "quests" } }, "*");
  } catch (e) { status("Save failed: " + e.message, "bad"); }
}


// Delete the open pack (it goes to the Recycle Bin), then open another one.
async function deletePack() {
  const exists = ((await api("/api/overview")).packs.quests || []).some(p => p.name === packName);
  if (!confirm(exists ? `Delete the pack "${packName}"?\n\nIt goes to the Recycle Bin (or Mods\\.trash on a drive without one), so you can get it back.`
                      : `"${packName}" was never saved. Throw it away?`)) return;
  if (exists) {
    try { await api(`/api/packs/delete?kind=quests&name=${encodeURIComponent(packName)}`, { method: "POST" }); }
    catch (e) { status("Couldn't delete: " + e.message, "bad"); return; }
  }
  const gone = packName;
  const left = ((await api("/api/overview")).packs.quests || []).map(p => p.name);
  dirty = false; parent.postMessage({ dirty: false }, "*");
  D.packs = left; D.packsOff = D.packsOff ? D.packsOff.filter(n => left.includes(n)) : [];
  const next = left[0] || "my-quests";
  packName = null; fillPacks(left.length ? left : [next]);
  await openPack(next);
  status(exists ? "Deleted (it's in the Recycle Bin)" : "Thrown away", "ok");
  parent.postMessage({ broadcast: { cmd: "packsChanged", kind: "quests", deleted: exists ? gone : undefined } }, "*");
}
$("#delPack").onclick = deletePack;
$("#save").onclick = save;
$("#packSel").onchange = e => openPack(e.target.value);
$("#newPack").onclick = () => {
  const n = prompt("Name for the new pack (letters, numbers, spaces, - and _):", "my-quests");
  if (!n) return;
  if (![...$("#packSel").options].some(o => o.value === n)) $("#packSel").insertAdjacentHTML("beforeend", `<option>${esc(n)}</option>`);
  ensurePack(n); openPack(n);
};
$("#tabPack").onclick = () => { tab = "pack"; renderList(); };
$("#tabOrig").onclick = () => { tab = "orig"; renderList(); };
$("#search").oninput = renderList;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } });

// Ctrl+K goes to the search box in the main window.
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); parent.postMessage({ key: "ctrl-k" }, "*"); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
boot().then(() => parent.postMessage({ ready: true }, "*")).catch(e => { status("Couldn't load: " + e.message, "bad"); parent.postMessage({ ready: true, error: e.message }, "*"); });
</script>
