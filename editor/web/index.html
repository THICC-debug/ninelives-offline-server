<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Lives Editor</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: grid; grid-template-columns: 210px 1fr; grid-template-rows: 52px 1fr; height: 100vh; overflow: hidden; }
  #brand { grid-row: 1; grid-column: 1; display: flex; align-items: center; gap: 9px; padding: 0 16px; font-weight: 700; font-size: 15px;
           background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  #top { grid-row: 1; grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #side { grid-row: 2; grid-column: 1; background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
  #side button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px;
                 padding: 9px 11px; color: var(--muted); font-size: 14px; position: relative; }
  #side button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #side button:hover { background: var(--chip); color: var(--ink); }
  #side button.on { background: var(--chip); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 var(--accent); }
  #side button .dot { position: absolute; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: none; }
  #side button.dirty .dot { display: block; }
  #side .navgroup { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 11px 4px; }
  #side .spacer { flex: 1; }
  #side .help { font-size: 12px; color: var(--muted); padding: 8px 11px; line-height: 1.4; }
  #frames { grid-row: 2; grid-column: 2; position: relative; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #frames iframe.on { display: block; }

  /* search */
  #find { position: relative; flex: 1; max-width: 560px; }
  #find input { width: 100%; padding: 8px 12px 8px 34px; border-radius: 8px; background: var(--bg); }
  #find svg { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
  #find kbd { position: absolute; right: 9px; top: 8px; font: 11px system-ui; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  #results { position: absolute; top: 40px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             box-shadow: 0 12px 32px rgba(0,0,0,.25); max-height: 60vh; overflow: auto; display: none; z-index: 10; }
  #results.on { display: block; }
  #results .r { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #results .r:last-child { border-bottom: 0; }
  #results .r.act { background: var(--chip); }
  #results .r b { font-weight: 600; }
  #results .r small { color: var(--muted); display: block; }
  #results .tag { font-size: 11px; min-width: 62px; color: var(--accent); font-weight: 600; }
  #results .none { padding: 12px; color: var(--muted); }
  #where { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 52px auto 1fr; }
    #brand { display: none; } #top { grid-column: 1; }
    #side { grid-row: 2; flex-direction: row; overflow-x: auto; padding: 6px; border-right: 0; border-bottom: 1px solid var(--line); }
    #side .navgroup, #side .spacer, #side .help { display: none; }
    #side button { width: auto; white-space: nowrap; }
    #frames { grid-row: 3; grid-column: 1; }
  }
</style>
</head>
<body>
<div id="brand"><i></i>Nine Lives Editor</div>
<div id="top">
  <div id="find">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Find a quest, item, monster, shop or NPC…" autocomplete="off">
    <kbd>Ctrl K</kbd>
    <div id="results"></div>
  </div>
  <span id="where"></span>
</div>
<nav id="side">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>Home<span class="dot"></span></button>
  <div class="navgroup">Make changes</div>
  <button data-tab="quests"><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h4"/></svg>Quests<span class="dot"></span></button>
  <button data-tab="items"><svg viewBox="0 0 24 24"><path d="M14.5 3.5 20.5 9.5 10 20H4v-6z"/><path d="m12 6 6 6"/></svg>Items<span class="dot"></span></button>
  <button data-tab="loot"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 13h18M8 9V6a4 4 0 0 1 8 0v3"/></svg>Monster loot<span class="dot"></span></button>
  <button data-tab="shops"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1 11H5z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg>Shops<span class="dot"></span></button>
  <button data-tab="npcs"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>NPCs<span class="dot"></span></button>
  <button data-tab="world"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>World<span class="dot"></span></button>
  <button data-tab="scripts"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/><path d="m14 4-4 16"/></svg>Scripts<span class="dot"></span></button>
  <div class="navgroup">Manage</div>
  <button data-tab="overview"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Packs &amp; mods<span class="dot"></span></button>
  <div class="spacer"></div>
  <div class="help">Changes are saved as <b>packs</b> in the game's Mods folder. They load when the game starts.</div>
</nav>
<div id="frames"></div>
<script>
// Each tab is its own page in an iframe, made on first visit and kept, so unsaved work survives
// switching tabs. Items, Monster loot and Shops share one page (content packs).
const PAGE = { home: "/home", overview: "/overview", quests: "/quests", items: "/content", loot: "/content", shops: "/content", npcs: "/npcs", world: "/world", scripts: "/scripts" };
const NAME = { home: "Home", overview: "Packs & mods", quests: "Quests", items: "Items", loot: "Monster loot", shops: "Shops", npcs: "NPCs", world: "World", scripts: "Scripts" };
const frames = {}, ready = {}, queue = {}, dirty = {};
let current = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function frameFor(tab) {
  const url = PAGE[tab];
  if (!frames[url]) {
    const f = document.createElement("iframe");
    f.src = url + (url === "/content" ? "?tab=" + tab : "");
    f.title = NAME[tab];
    $("#frames").appendChild(f);
    frames[url] = f; queue[url] = [];
  }
  return frames[url];
}
function send(tab, msg) {
  const url = PAGE[tab], f = frameFor(tab);
  if (ready[url]) f.contentWindow.postMessage(msg, "*"); else queue[url].push(msg);
}
function show(tab, msg) {
  if (!PAGE[tab]) tab = "home";
  const f = frameFor(tab);
  current = tab;
  Object.values(frames).forEach(x => x.classList.toggle("on", x === f));
  document.querySelectorAll("#side button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (PAGE[tab] === "/content") send(tab, { contentTab: tab });
  if (msg) send(tab, msg);
  history.replaceState(null, "", "#" + tab);
  try { localStorage.setItem("nle.tab", tab); } catch (e) {}
  $("#where").textContent = "";
}
function urlOf(win) { return Object.keys(frames).find(u => frames[u].contentWindow === win); }
function markDirty() {
  document.querySelectorAll("#side button").forEach(b => b.classList.toggle("dirty", !!dirty[PAGE[b.dataset.tab]]));
}
// Asked by the app window before it closes.
window.anyDirty = () => Object.values(dirty).some(Boolean);

window.addEventListener("message", e => {
  const d = e.data || {}, url = urlOf(e.source);
  if (d.ready && url) { ready[url] = true; queue[url].splice(0).forEach(m => frames[url].contentWindow.postMessage(m, "*")); }
  if ("dirty" in d && url) { dirty[url] = !!d.dirty; markDirty(); }
  if (d.where !== undefined && url && frames[url].classList.contains("on")) $("#where").textContent = d.where;
  if (d.nav && PAGE[d.nav]) show(d.nav, d.msg);
  if (d.cmd === "focusSearch") { $("#q").focus(); if (d.q) { $("#q").value = d.q; search(); } }
  if (d.broadcast) {
    Object.values(frames).forEach(f => f.contentWindow && f.contentWindow !== e.source && f.contentWindow.postMessage(d.broadcast, "*"));
    if (d.broadcast.cmd === "packsChanged" || d.broadcast.cmd === "npcsChanged") index = null;   // search sees new things
  }
});
document.querySelectorAll("#side button").forEach(b => b.onclick = () => show(b.dataset.tab));
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (PAGE[t] && t !== current) show(t); });
window.addEventListener("beforeunload", e => { if (anyDirty()) { e.preventDefault(); e.returnValue = ""; } });

// ---------------------------------------------------------------- search everything
let index = null, hits = [], act = 0;
const KIND = {
  quest: ["Quest", h => ["quests", { cmd: "select", id: h.id }]],
  myquest: ["My quest", h => ["quests", { cmd: "select", id: h.id }]],
  item: ["Item", h => ["items", { cmd: "select", key: "i:" + h.id }]],
  loot: ["Monster", h => ["loot", { cmd: "select", key: "d:" + h.id }]],
  shop: ["Shop", h => ["shops", { cmd: "select", key: "d:" + h.id }]],
  npc: ["My NPC", h => ["npcs", { cmd: "select", id: h.id }]],
  obj: ["World", h => ["world", { cmd: "select", id: h.id }]],
  rule: ["Rule", h => ["scripts", { cmd: "select", id: h.id }]],
  giver: ["NPC", h => ["quests", { cmd: "search", q: h.n }]],
};
async function loadIndex() {
  if (!index) {
    const seen = new Set();   // the same monster can be listed once per zone visit
    index = (await (await fetch("/api/index")).json()).filter(h => { const k = h.k + "|" + h.id + "|" + h.n.trim().toLowerCase(); return !seen.has(k) && seen.add(k); });
  }
  return index;
}
function score(h, words) {
  const n = h.n.toLowerCase(), all = (h.n + " " + h.s + " " + h.id).toLowerCase();
  if (!words.every(w => all.includes(w))) return -1;
  let s = 0;
  if (n === words.join(" ")) s += 100;
  if (n.startsWith(words[0])) s += 40;
  words.forEach(w => { if (n.includes(w)) s += 10; });
  if (h.k === "myquest" || h.k === "npc") s += 5;    // the player's own things first on ties
  return s - n.length / 100;
}
async function search() {
  const q = $("#q").value.trim().toLowerCase(), box = $("#results");
  if (!q) { box.classList.remove("on"); return; }
  const idx = await loadIndex(), words = q.split(/\s+/);
  hits = idx.map(h => [score(h, words), h]).filter(x => x[0] >= 0).sort((a, b) => b[0] - a[0]).slice(0, 40).map(x => x[1]);
  act = 0;
  box.innerHTML = hits.length ? hits.map((h, i) => `<div class="r${i === act ? " act" : ""}" data-i="${i}"><span class="tag">${KIND[h.k][0]}</span><div><b>${esc(h.n)}</b><small>${esc(h.s)}</small></div></div>`).join("")
                              : '<div class="none">Nothing found. Play the game once with the mods (enter the world) so they can list everything.</div>';
  box.classList.add("on");
  box.querySelectorAll(".r").forEach(el => el.onmousedown = e => { e.preventDefault(); pick(+el.dataset.i); });
}
function pick(i) {
  const h = hits[i]; if (!h) return;
  const [tab, msg] = KIND[h.k][1](h);
  show(tab, msg);
  $("#results").classList.remove("on"); $("#q").blur();
}
function moveAct(d) {
  if (!hits.length) return;
  act = (act + d + hits.length) % hits.length;
  document.querySelectorAll("#results .r").forEach((el, i) => el.classList.toggle("act", i === act));
  const el = document.querySelector("#results .r.act"); if (el) el.scrollIntoView({ block: "nearest" });
}
$("#q").oninput = search;
$("#q").onfocus = () => { loadIndex(); if ($("#q").value) search(); };
$("#q").onblur = () => setTimeout(() => $("#results").classList.remove("on"), 150);
$("#q").onkeydown = e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveAct(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveAct(-1); }
  else if (e.key === "Enter") { e.preventDefault(); pick(act); }
  else if (e.key === "Escape") { $("#q").value = ""; $("#results").classList.remove("on"); $("#q").blur(); }
};
function searchKeys(e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#q").focus(); $("#q").select(); }
}
document.addEventListener("keydown", searchKeys);
// Pages pass Ctrl+K up to here (they're in iframes).
window.addEventListener("message", e => { if ((e.data || {}).key === "ctrl-k") { $("#q").focus(); $("#q").select(); } });

let start = location.hash.slice(1);
if (!PAGE[start]) { try { start = localStorage.getItem("nle.tab") || "home"; } catch (e) { start = "home"; } }
show(PAGE[start] ? start : "home");
</script>
</body>
</html>
