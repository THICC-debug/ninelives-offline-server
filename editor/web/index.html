<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Lives Editor</title>
<link rel="stylesheet" href="/style.css">
<script src="/gameview.js"></script>
<style>
  :root { --L: 260px; --R: 380px; --B: 300px; }
  body { display: grid; grid-template-rows: 48px 1fr; height: 100vh; overflow: hidden; }

  /* menu bar */
  #bar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
  #brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  #brand i { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
  #ws, #ws2 { display: flex; gap: 6px; align-items: center; min-width: 0; }
  #ws { overflow-x: auto; scrollbar-width: none; flex: 0 0 auto; max-width: 70vw; }
  #ws::-webkit-scrollbar { display: none; }
  #ws .grp { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); flex: none; }
  #ws button, #ws2 button { display: flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: 7px; height: 28px; padding: 0 10px;
                            color: var(--muted); font-size: 13px; white-space: nowrap; position: relative; transition: background .12s, color .12s; }
  #ws button svg, #ws2 button svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #ws button:hover, #ws2 button:hover { background: var(--chip); color: var(--ink); }
  #ws button.on, #ws2 button.on { background: color-mix(in srgb, var(--accent) 20%, var(--panel)); color: var(--ink); font-weight: 600; }
  #ws button.on svg, #ws2 button.on svg { stroke: var(--accent); }
  #ws2 button.icon { padding: 0 7px; } #ws2 button.icon .lbl { display: none; }
  #ws button .dot, #ws2 button .dot { position: absolute; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); display: none; }
  #ws button.dirty .dot, #ws2 button.dirty .dot { display: block; }
  /* ⧉ on a tab: open its page in a window of its own */
  #ws button, #ws2 button { position: relative; }
  #ws button .pop, #ws2 button .pop { display: none; position: absolute; right: 1px; bottom: 1px; width: 15px; height: 15px; line-height: 13px; font-size: 11px; font-weight: 400;
      text-align: center; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  #ws button:hover .pop, #ws2 button:hover .pop { display: block; }
  #ws button .pop:hover, #ws2 button .pop:hover { color: var(--accent); border-color: var(--accent); }
  #ws button.popped, #ws2 button.popped { box-shadow: inset 0 -2px 0 var(--accent); }
  @media (max-width: 1450px) { #ws .grp:last-child .lbl { display: none; } #ws .grp:last-child button { padding: 0 7px; }
                               #ws .grp:last-child button.on .lbl { display: inline; } #ws .grp:last-child button.on { padding: 0 10px; } }   /* where you are keeps its name */
  @media (max-width: 1150px) { #ws .lbl, #ws2 .lbl { display: none; } #ws button, #ws2 button { padding: 0 7px; } #brand span { display: none; } }
  #find { position: relative; flex: 1 1 220px; min-width: 110px; max-width: 320px; margin-left: auto; }
  #find input { width: 100%; padding: 5px 10px 5px 30px; border-radius: 7px; background: var(--bg); font-size: 13px; }
  #find svg { position: absolute; left: 9px; top: 7px; width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
  #find kbd { position: absolute; right: 8px; top: 6px; font: 10px system-ui; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
  #results { position: absolute; top: 36px; right: 0; width: min(560px, 90vw); background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             box-shadow: 0 12px 32px rgba(0,0,0,.3); max-height: 60vh; overflow: auto; display: none; z-index: 20; }
  #results.on { display: block; }
  #results .r { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #results .r:last-child { border-bottom: 0; }
  #results .r.act { background: var(--chip); }
  #results .r b { font-weight: 600; }
  #results .r small { color: var(--muted); display: block; }
  #results .tag { font-size: 11px; min-width: 62px; color: var(--accent); font-weight: 600; }
  #results .none { padding: 12px; color: var(--muted); }
  #where { display: none; }
  #play { display: flex; gap: 6px; align-items: center; font-size: 12px; white-space: nowrap; }
  #play button { padding: 3px 9px; font-size: 12px; }
  #play .st { color: var(--muted); }
  #play .st.ok { color: var(--ok); }

  /* the stage: the Build layout, or one full page */
  #stage { position: relative; min-height: 0; }
  #build { position: absolute; inset: 0; display: grid;
           grid-template-columns: var(--L) 5px 1fr 5px var(--R);
           grid-template-rows: 36px 1fr 5px var(--B);
           grid-template-areas: "left sl tool sr right" "left sl view sr right" "left sl sb sr right" "left sl bottom sr right"; }
  #build.off { display: none; }
  .slot { background: var(--panel); min-width: 0; min-height: 0; position: relative; }
  #slotLeft { grid-area: left; } #slotRight { grid-area: right; } #slotBottom { grid-area: bottom; }
  .slot.dock { display: flex; flex-direction: column; }
  /* each panel holds one or two tab groups: stacked at the sides, side by side below */
  #slotBottom.dock { flex-direction: row; }
  .dgroup { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; min-height: 0; }
  .dgroup.empty, .isplit.hide { display: none; }
  .isplit { flex: none; background: var(--line); }
  #slotLeft .isplit, #slotRight .isplit { height: 5px; cursor: row-resize; } #slotBottom .isplit { width: 5px; cursor: col-resize; }
  .isplit:hover, .isplit.drag { background: var(--accent); }
  .pbody { flex: 1; min-height: 0; min-width: 0; }
  /* a group with no tabs folds away */
  #build.no-left { grid-template-columns: 0 0 1fr 5px var(--R); } #build.no-right { grid-template-columns: var(--L) 5px 1fr 0 0; }
  #build.no-left.no-right { grid-template-columns: 0 0 1fr 0 0; }
  #build.no-bottom { grid-template-rows: 36px 1fr 0 0; }
  /* the bottom panel across the whole width, under the side panels too */
  #build.wide-bottom { grid-template-areas: "left sl tool sr right" "left sl view sr right" "sb sb sb sb sb" "bottom bottom bottom bottom bottom"; }
  #build.no-left #slotLeft, #build.no-left #splitL, #build.no-right #slotRight, #build.no-right #splitR, #build.no-bottom #slotBottom, #build.no-bottom #splitB { display: none; }
  .ptabs { overflow-x: auto; scrollbar-width: none; } .ptabs::-webkit-scrollbar { display: none; }
  .ptabs .dtab { position: relative; flex: none; cursor: grab; user-select: none; }
  .ptabs .dtab .x { margin-left: 5px; font-size: 10px; opacity: 0; }
  .ptabs .dtab:hover .x, .ptabs .dtab.on .x { opacity: .5; } .ptabs .dtab .x:hover { opacity: 1; color: var(--bad); }
  .ptabs .gbtn { flex: none; padding: 0 7px; }
  /* dragging a tab: where it can go */
  #dropzones { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
  body.dragging { user-select: none; cursor: grabbing; }
  #dropzones .dz { position: absolute; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 6%, transparent);
                   display: flex; align-items: center; justify-content: center; box-sizing: border-box; transition: background .08s; }
  #dropzones .dz span { font-size: 13px; font-weight: 600; color: var(--ink); background: var(--panel); padding: 4px 10px; border-radius: 6px; opacity: .75; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #dropzones .dz.pop { border-style: dotted; background: transparent; }
  #dropzones .dz.split { border-style: dashed; background: color-mix(in srgb, var(--accent) 12%, transparent); }
  #dropzones .dz.hot { background: color-mix(in srgb, var(--accent) 30%, transparent); border-style: solid; border-color: var(--accent); }
  #dropzones .dz.hot span { opacity: 1; }
  #dropzones .ghost { position: absolute; padding: 3px 10px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.4); white-space: nowrap; }
  #dropzones .ins { position: absolute; width: 3px; border-radius: 2px; background: var(--accent); display: none; }
  .split { background: var(--line); }
  .split:hover, .split.drag { background: var(--accent); }
  #splitL { grid-area: sl; cursor: col-resize; } #splitR { grid-area: sr; cursor: col-resize; } #splitB { grid-area: sb; cursor: row-resize; }
  .ptabs { display: flex; gap: 2px; align-items: center; height: 30px; padding: 0 6px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
  .ptabs button { border: 0; border-radius: 6px; background: none; height: 22px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .ptabs button:hover { color: var(--ink); background: var(--chip); }
  .ptabs button.on { color: var(--ink); background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
  .ptabs .hint { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 8px; }
  .pbody { flex: 1; position: relative; min-height: 0; }
  #tool { grid-area: tool; display: flex; gap: 8px; align-items: center; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  #tool::-webkit-scrollbar { display: none; }
  #tool button { padding: 3px 9px; font-size: 12px; }
  #tool select { padding: 2px 6px; font-size: 12px; }
  #tool label { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink); }
  #tool .sep { width: 1px; height: 20px; background: var(--line); }
  #tool .info { color: var(--muted); }
  #tool .seg { display: flex; gap: 1px; padding: 2px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line); flex: none; }
  #tool .seg button { border: 0; background: none; padding: 2px 8px; border-radius: 5px; color: var(--muted); }
  #tool .seg button.on { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); color: var(--ink); font-weight: 600; }
  #tool .seg button { display: grid; place-items: center; width: 30px; height: 24px; padding: 0; }
  #tool .seg svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #tool .grow { flex: 1; min-width: 20px; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  #tool #packInfo { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  #tool button.dirty { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .menu { position: absolute; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.35);
          padding: 6px; width: 270px; display: flex; flex-direction: column; gap: 2px; }
  .menu[hidden] { display: none; }
  .menu .mrow { display: flex; gap: 8px; align-items: center; padding: 4px 8px; font-size: 13px; color: var(--ink); }
  .menu label.mrow:hover { background: var(--chip); border-radius: 6px; cursor: pointer; }
  .menu .mrow b { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 4px; }
  .menu select { flex: 1; }
  .menu label.mrow { flex-direction: row; justify-content: flex-start; text-align: left; margin: 0; }
  .menu label.mrow input[type=checkbox], #tool label input[type=checkbox] { display: inline-block; width: auto; flex: none; margin: 0; }
  .menu label.mrow input[type=range] { display: inline-block; margin: 0; }
  #viewport { grid-area: view; position: relative; background: #0d0d0e; min-height: 0; overflow: hidden; }
  #viewport .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #bbb; text-align: center; padding: 30px; line-height: 1.6; }
  #viewport .gv { border: 0; border-radius: 0; margin: 0; height: 100%; display: flex; flex-direction: column; }
  #viewport .gv .pic { flex: 1; display: grid; place-items: center; }
  #viewport .gv img { max-height: 100%; width: auto; max-width: 100%; }

  /* the pages (iframes), placed over the slots or over the whole stage */
  #frames { position: absolute; inset: 0; pointer-events: none; }
  #frames iframe { position: absolute; border: 0; display: none; background: var(--bg); pointer-events: auto; }
  body.dragging #frames iframe { pointer-events: none; }
  #frames .holder { position: absolute; display: none; align-items: center; justify-content: center; text-align: center; background: var(--bg); pointer-events: auto; padding: 20px; }
  #frames .holder .title { font-size: 16px; font-weight: 600; }

</style>
</head>
<body>
<div id="bar">
  <div id="brand"><i></i><span>Nine Lives Editor</span></div>
  <nav id="ws">
    <div class="grp"><button data-tab="build" title="Build"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span class="lbl">Build</span><span class="dot"></span></button><button data-tab="map" title="Map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span class="lbl">Map</span><span class="dot"></span></button></div>
    <div class="grp"><button data-tab="quests" title="Quests"><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h4"/></svg><span class="lbl">Quests</span><span class="dot"></span></button><button data-tab="items" title="Items"><svg viewBox="0 0 24 24"><path d="M14.5 3.5 20.5 9.5 10 20H4v-6z"/><path d="m12 6 6 6"/></svg><span class="lbl">Items</span><span class="dot"></span></button><button data-tab="loot" title="Monster loot"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 13h18M8 9V6a4 4 0 0 1 8 0v3"/></svg><span class="lbl">Monster loot</span><span class="dot"></span></button><button data-tab="shops" title="Shops"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1 11H5z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg><span class="lbl">Shops</span><span class="dot"></span></button><button data-tab="dialogs" title="Dialogue"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span class="lbl">Dialogue</span><span class="dot"></span></button><button data-tab="scripts" title="Scripts"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/><path d="m14 4-4 16"/></svg><span class="lbl">Scripts</span><span class="dot"></span></button></div>
  </nav>
  <div id="find">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Find anything…" autocomplete="off">
    <kbd>Ctrl K</kbd>
    <div id="results"></div>
  </div>
  <span id="where"></span>
  <div id="play" title="The game runs in the background as the editor's 3D view: no character, a free camera">
    <span class="st" id="playSt">3D view: off</span>
    <button id="playGo" class="primary">▶ Start</button>
    <button id="playShow" hidden title="Show or hide the game's own window">Game window</button>
    <button id="playStop" hidden>Stop</button>
  </div>
  <div id="ws2"><button data-tab="overview" title="Packs &amp; mods"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="lbl">Packs &amp; mods</span><span class="dot"></span></button><button data-tab="home" title="Help" class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17h0"/></svg><span class="lbl">Help</span><span class="dot"></span></button></div>
</div>
<div id="stage">
  <div id="build">
    <div class="slot dock" id="slotLeft"><div class="dgroup" data-g="left"><div class="ptabs"></div><div class="pbody"></div></div><div class="isplit" data-s="left" title="Drag to resize"></div><div class="dgroup" data-g="left2"><div class="ptabs"></div><div class="pbody"></div></div></div>
    <div class="split" id="splitL" title="Drag to resize"></div>
    <div id="tool">
      <div class="seg" id="toolSeg">
        <button data-t="select" title="Select (Q)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
        <button data-t="move" class="on" title="Move (W): drag the arrows, or the thing itself"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg></button>
        <button data-t="rotate" title="Rotate (E): drag a ring"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
        <button data-t="scale" title="Scale (R): drag the cube"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="10" height="10"/><path d="M13 11l8-8M15 3h6v6"/></svg></button>
      </div>
      <label class="snap" title="Snap moves to a grid and turns to angle steps (hold Ctrl in the 3D view to flip it)"><input type="checkbox" id="snapOn">Snap</label>
      <select id="snapGrid" title="Grid size"><option value="0.25">0.25 m</option><option value="0.5" selected>0.5 m</option><option value="1">1 m</option><option value="2">2 m</option><option value="4">4 m</option></select>
      <select id="snapAngle" title="Angle step"><option value="5">5°</option><option value="15" selected>15°</option><option value="45">45°</option><option value="90">90°</option></select>
      <span class="sep"></span>
      <button id="tSave" title="Save the World, NPC and enemy packs (Ctrl+S)">Save</button>
      <button id="tUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="tDiscard" title="Throw away unsaved changes">Discard</button>
      <span class="info grow" id="toolNote"></span>
      <span class="info" id="packInfo" title="The World pack being edited (change it in the inspector)"></span>
      <button id="viewBtn" title="Zone, view and 3D view settings">View ▾</button>
    </div>
    <div id="viewMenu" class="menu" hidden style="position:absolute">
      <div class="mrow"><b>Zone</b></div>
      <div class="mrow"><select id="zoneSel" title="Go to another zone"></select><button id="zoneGo">Go</button></div>
      <div class="mrow"><b>View</b></div>
      <label class="mrow" title="Hide the game's NPCs and monsters (yours too)"><input type="checkbox" data-tool="npcs">Hide NPCs and monsters</label>
      <label class="mrow" title="Even, bright light everywhere"><input type="checkbox" data-tool="bright">Bright light</label>
      <label class="mrow" title="No fog, to see far"><input type="checkbox" data-tool="fog">No fog</label>
      <label class="mrow" title="How fast the view turns when you hold the right mouse button">Look speed <input type="range" id="lookSpeed" min="0.1" max="2" step="0.05" style="flex:1"></label>
      <div class="mrow"><b>Panels</b></div>
      <label class="mrow" title="The bottom panel runs under the left and right panels too"><input type="checkbox" id="wideBottom">Bottom panel across the whole width</label>
      <div class="mrow"><button id="resetDock" title="Outliner left; Placed thing, NPC, Enemy right; Assets and Map below; no splits">Put the panels back as they were</button></div>
      <div class="mrow"><b>3D view</b></div>
      <label class="mrow" title="Start the 3D view by itself when the editor opens"><input type="checkbox" id="autoStart">Start it when the editor opens</label>
    </div>
    <div id="viewport"><div class="msg">Starting the 3D view…</div></div>
    <div class="split" id="splitR" title="Drag to resize"></div>
    <div class="split" id="splitB" title="Drag to resize"></div>
    <div class="slot dock" id="slotRight"><div class="dgroup" data-g="right"><div class="ptabs"></div><div class="pbody"></div></div><div class="isplit" data-s="right" title="Drag to resize"></div><div class="dgroup" data-g="right2"><div class="ptabs"></div><div class="pbody"></div></div></div>
    <div class="slot dock" id="slotBottom"><div class="dgroup" data-g="bottom"><div class="ptabs"></div><div class="pbody"></div></div><div class="isplit" data-s="bottom" title="Drag to resize"></div><div class="dgroup" data-g="bottom2"><div class="ptabs"></div><div class="pbody"></div></div></div>
  </div>
  <div id="frames"></div>
</div>
<script>
// The editor's settings (panel layout and sizes, last tab, window spots…) are kept in the browser's storage,
// which goes with this server's address, and its port changes every run. So they're also kept in a file by
// the editor (/api/prefs): put them back first, and save them when they change.
(() => {
  const snap = () => { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("nle.")) o[k] = localStorage.getItem(k); } } catch (e) {} return JSON.stringify(o); };
  try {
    const x = new XMLHttpRequest(); x.open("GET", "/api/prefs", false); x.send();   // (before anything reads them)
    const saved = x.status === 200 ? JSON.parse(x.responseText || "{}") : {};
    for (const k in saved) if (k.startsWith("nle.") && localStorage.getItem(k) == null && typeof saved[k] === "string") localStorage.setItem(k, saved[k]);
  } catch (e) {}
  let last = snap();
  const push = () => { const s = snap(); if (s === last) return; last = s; try { fetch("/api/prefs/save", { method: "POST", body: s, keepalive: true }).catch(() => {}); } catch (e) {} };
  setInterval(push, 3000);
  addEventListener("pagehide", push);
})();
// Workspaces: "build" is the 3D view with panels around it (outliner left, inspector right, assets and
// map below); the others are one page over the whole stage. Each page is its own iframe, made on first
// use and kept (unsaved work survives switching); the World, NPCs and Map pages are moved (not reloaded)
// between their panel in Build and their own full workspace. Items, Monster loot and Shops share a page.
const PAGE = { home: "/home", overview: "/overview", quests: "/quests", items: "/content", loot: "/content", shops: "/content", npcs: "/npcs", enemies: "/enemies", world: "/world",

// ---------------------------------------------------------------- search everything
let index = null, hits = [], act = 0;
const KIND = {
  quest: ["Quest", h => ["quests", { cmd: "select", id: h.id }]],
  myquest: ["My quest", h => ["quests", h.pack ? { cmd: "openPack", name: h.pack, then: { cmd: "select", id: h.id } } : { cmd: "select", id: h.id }]],
  item: ["Item", h => ["items", { cmd: "select", key: "i:" + h.id }]],
  loot: ["Monster", h => ["loot", { cmd: "select", key: "d:" + h.id }]],
  shop: ["Shop", h => ["shops", { cmd: "select", key: "d:" + h.id }]],
  npc: ["My NPC", h => ["npcs", { cmd: "select", id: h.id }]],
  obj: ["World", h => ["world", h.pack ? { cmd: "openPack", name: h.pack, then: { cmd: "select", id: h.id } } : { cmd: "select", id: h.id }]],
  rule: ["Rule", h => ["scripts", h.pack ? { cmd: "openPack", name: h.pack, then: { cmd: "select", id: h.id } } : { cmd: "select", id: h.id }]],
  dlg: ["Dialogue", h => ["dialogs", { cmd: "openPack", name: h.pack, then: { cmd: "select", id: h.id } }]],

let indexLoading = null;
async function loadIndex() {
  if (index) return index;
  if (!indexLoading) indexLoading = (async () => {
    const seen = new Set();   // the same monster can be listed once per zone visit
    const all = await (await fetch("/api/index")).json();
    index = all.filter(h => h && h.n && h.k in KIND).filter(h => { const k = h.k + "|" + h.id + "|" + String(h.n).trim().toLowerCase(); return !seen.has(k) && seen.add(k); });
    indexLoading = null;
    return index;
  })().catch(e => { indexLoading = null; return []; });
  return indexLoading;
}
function score(h, words) {
  const n = h.n.toLowerCase(), all = (h.n + " " + h.s + " " + h.id).toLowerCase();
  if (!words.every(w => all.includes(w))) return -1;
  let s = 0;
  if (n === words.join(" ")) s += 100;
  if (n.startsWith(words[0])) s += 40;
  words.forEach(w => { if (n.includes(w)) s += 10; });
  if (h.k === "myquest" || h.k === "npc") s += 5;    // the player's own things first on ties
  return s - n.length / 100;
}
async function search() {
  const q = $("#q").value.trim().toLowerCase(), box = $("#results");
  if (!q) { box.classList.remove("on"); return; }
  const idx = await loadIndex(), words = q.split(/\s+/);
  if ($("#q").value.trim().toLowerCase() !== q) return;   // typed on while the list was loading
  hits = idx.map(h => [score(h, words), h]).filter(x => x[0] >= 0).sort((a, b) => b[0] - a[0]).slice(0, 40).map(x => x[1]);
  act = 0;
  box.innerHTML = hits.length ? hits.map((h, i) => `<div class="r${i === act ? " act" : ""}" data-i="${i}"><span class="tag">${KIND[h.k][0]}</span><div><b>${esc(h.n)}</b><small>${esc(h.s)}</small></div></div>`).join("")
                              : (idx.length ? `<div class="none">No matches for “${esc(q)}”.</div>` : '<div class="none">Nothing to search yet. Start the 3D view (or play once with the mods) so they can list everything.</div>');
  box.classList.add("on");
  box.querySelectorAll(".r").forEach(el => el.onmousedown = e => { e.preventDefault(); pick(+el.dataset.i); });
}
function pick(i) {

  $("#results").classList.remove("on"); $("#q").blur();
}

// The search list opens over the 3D view: the game window (a separate window) would hide it, so hide the game meanwhile.

// ---------------------------------------------------------------- edits made in the game (build mode)
// WorldLoader keeps a list of what you did in build mode; pass each one to the page that owns it, which
// keeps it as an unsaved change (so Save and Discard work as usual).
let buildAfter = null, buildWait = 500;
async function pollBuild() {
  try {
    if (buildAfter == null) {   // start from now: don't replay what happened before the editor opened
      const s = await (await fetch("/api/live/world/build")).json();
      if (s.last == null) throw new Error("no build mode");
      buildAfter = s.last;
    }
    const r = await (await fetch("/api/live/world/build/events?after=" + buildAfter)).json();
    if (r.last == null) throw new Error("no build mode");
    if (r.last < buildAfter) buildAfter = 0;   // the game restarted
    for (const ev of r.events || []) {
      buildAfter = Math.max(buildAfter, ev.n);
      if (ev.type === "build") { Object.values(frames).forEach(f => f.contentWindow && f.contentWindow.postMessage({ cmd: "buildMode", on: ev.on }, "*")); for (const u in popped) if (ready[u]) deliver(u, { cmd: "buildMode", on: ev.on }); continue; }
      if (ev.type === "tool") { showTool(ev.tool); continue; }
      if (ev.type === "menu") {   // the 3D view's right-click menu
        const kindTab = ev.kind === "npc" ? "npcs" : ev.kind === "enemy" ? "enemies" : "world";
        if (ev.action === "properties") openInBuild(kindTab, { cmd: "select", id: ev.id });
        if (ev.action === "dialogue") show("dialogs", { cmd: "newDialog", npc: ev.id });
        if (ev.action === "quest") show("quests", { cmd: "newQuest", giver: ev.id });
        continue;
      }
      if (ev.type === "undo") { send("world", { cmd: "undo" }); continue; }
      if (ev.type === "save") { send("world", { cmd: "save" }); send("npcs", { cmd: "save" }); if (frames[PAGE.enemies]) send("enemies", { cmd: "save" }); continue; }
      const tab = ev.kind === "npc" ? "npcs" : ev.kind === "enemy" ? "enemies" : "world";
      send(tab, { cmd: "gameEdit", ev });
      post(PAGE.outliner, { cmd: "gameEvent", ev });
      if (ev.type === "pick" || ev.type === "select") { if (current === "build") setInsp(tab); }
    }
    buildWait = 500;
  } catch (e) { buildAfter = null; buildWait = 3000; }
  setTimeout(pollBuild, buildWait);
}

// ---------------------------------------------------------------- the game window in the middle of Build
// The editor app (WebView2 host) puts the game's own window over the viewport. In a plain web browser,
// or when the game wasn't started by the editor, the viewport shows pictures instead (gameview.js).
const host = window.chrome && window.chrome.webview;

function placeGame() {
  const live = G.connected && G.inWorld;
  const showIt = current === "build" && live && !overlay && !document.body.classList.contains("dragging");
  if (host) {
    const r = $("#viewport").getBoundingClientRect(), k = window.devicePixelRatio || 1;
    const msg = { cmd: "gameRect", x: Math.round(r.left * k), y: Math.round(r.top * k), w: Math.round(r.width * k), h: Math.round(r.height * k), show: showIt };
    const key = JSON.stringify(msg), now = Date.now();

  }

  if (live && host && docked === null) { const h = `<div class="msg"><div>Connecting the 3D view…</div></div>`; if (lastVp !== h) { lastVp = h; v.innerHTML = h; } return; }

    : P.running ? (G.connected ? "Getting into the world… (" + esc(G.editor || "starting") + ")" : "Starting the game in the background…")
    : P.other ? "The game is running in its own window (started with the Play shortcut).<br>Close it and press ▶ Start to build here."
    : "The game runs in the background with no character: you fly around and build.";
  const canStart = !P.running && !P.other;
  const html = `<div class="msg"><div>${canStart ? '<button class="primary" id="vpStart" style="font-size:15px;padding:9px 22px;margin-bottom:12px">▶ Start the 3D view</button><br>' : ""}${text}</div></div>`;

}

let look = 0.6; try { look = +(localStorage.getItem("nle.look") || 0.6); } catch (e) {}
$("#lookSpeed").value = look;
function sendLook() { fetch("/api/live/editor/look?scale=" + look, { method: "POST", body: "{}" }).catch(() => {}); }
$("#lookSpeed").oninput = () => { look = +$("#lookSpeed").value; try { localStorage.setItem("nle.look", look); } catch (e) {} sendLook(); };
function toolsLive() {
  const key = G.editor + "|" + G.zone;
  if (lookSentFor !== key) {
    lookSentFor = key; sendLook(); sendSnap();
    document.querySelectorAll("[data-tool]").forEach(c => { if (c.checked) fetch(`/api/live/editor/toggle?name=${c.dataset.tool}&on=1`, { method: "POST", body: "{}" }).catch(() => {}); });
  }
  if (G.zone && G.zone !== lastZone) {
    lastZone = G.zone; $("#zoneSel").value = G.zone; toolNote("");
    post(PAGE.outliner, { cmd: "zoneChanged", zone: G.zone }); post(PAGE.assets, { cmd: "zoneChanged", zone: G.zone });
  }
}
// build tools and snapping (the 3D view's W E R keys and these buttons stay in step)
function showTool(t) { document.querySelectorAll("#toolSeg button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); }
document.querySelectorAll("#toolSeg button").forEach(b => b.onclick = () => { showTool(b.dataset.t); fetch("/api/live/world/tool?name=" + b.dataset.t, { method: "POST", body: "{}" }).catch(() => {}); });
const snapPref = (() => { try { return JSON.parse(localStorage.getItem("nle.snap") || "{}"); } catch (e) { return {}; } })();
if (snapPref.on) $("#snapOn").checked = true; if (snapPref.grid) $("#snapGrid").value = snapPref.grid; if (snapPref.angle) $("#snapAngle").value = snapPref.angle;
function sendSnap() {
  const on = $("#snapOn").checked ? 1 : 0, grid = $("#snapGrid").value, angle = $("#snapAngle").value;
  try { localStorage.setItem("nle.snap", JSON.stringify({ on: !!on, grid, angle })); } catch (e) {}
  fetch(`/api/live/world/snap?on=${on}&grid=${grid}&angle=${angle}`, { method: "POST", body: "{}" }).then(r => r.json()).then(r => { if (r.tool) showTool(r.tool); }).catch(() => {});
}
["#snapOn", "#snapGrid", "#snapAngle"].forEach(id => $(id).onchange = sendSnap);
// The View menu (and drop-down lists) open over the 3D view, which is a separate window on top: hide it meanwhile.
function setViewMenu(open) {
  const m = $("#viewMenu"), b = $("#viewBtn").getBoundingClientRect(), st = $("#stage").getBoundingClientRect();
  m.hidden = !open;
  if (open) { m.style.left = Math.max(4, b.right - st.left - 270) + "px"; m.style.top = (b.bottom - st.top + 4) + "px"; }
  menuOpen = open; overlay = searchOpen || pickerOpen || menuOpen; placeGame();
}
let menuOpen = false;
$("#viewBtn").onclick = e => { e.stopPropagation(); setViewMenu($("#viewMenu").hidden); };
document.addEventListener("mousedown", e => { if (menuOpen && !e.target.closest("#viewMenu") && e.target.id !== "viewBtn") setViewMenu(false); });
let autoStart = true; try { autoStart = localStorage.getItem("nle.autostart") !== "0"; } catch (e) {}
$("#autoStart").checked = autoStart;
$("#autoStart").onchange = () => { autoStart = $("#autoStart").checked; try { localStorage.setItem("nle.autostart", autoStart ? "1" : "0"); } catch (e) {} };
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") e.preventDefault();   // (never the browser's "save page")
  if (current !== "build") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { send("world", { cmd: "save" }); send("npcs", { cmd: "save" }); if (frames[PAGE.enemies]) send("enemies", { cmd: "save" }); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) { e.preventDefault(); send("world", { cmd: "undo" }); }
});

// ---------------------------------------------------------------- start
let start = location.hash.slice(1);
if (!(start in PAGE)) { try { start = localStorage.getItem("nle.tab") || "build"; } catch (e) { start = "build"; } }
if (start === "view") start = "build";
show(start in PAGE ? start : "build");
frameFor("world");   // the World page owns the pack the Build toolbar shows
loadZones();
playStatus().then(() => { if (autoStart && !P.running && !P.other) startPlay(); });
</script>
</body>
</html>
