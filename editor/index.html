<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Lives Editor</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  nav { display: flex; align-items: stretch; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  nav .brand { font-weight: 700; font-size: 15px; padding: 10px 14px 10px 2px; display: flex; align-items: center; gap: 8px; }
  nav .brand span { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  nav button { border: 0; border-radius: 0; background: none; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted); }
  nav button.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
  nav button:hover { color: var(--ink); }
  nav .sep { width: 1px; background: var(--line); margin: 8px 6px; }
  #frames { flex: 1; position: relative; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #frames iframe.on { display: block; }
</style>
</head>
<body>
<nav>
  <div class="brand"><span></span>Nine Lives Editor</div>
  <button data-tab="overview">Overview</button>
  <div class="sep"></div>
  <button data-tab="quests">Quests</button>
  <button data-tab="items">Items</button>
  <button data-tab="loot">Loot</button>
  <button data-tab="shops">Shops</button>
  <button data-tab="npcs">NPCs</button>
</nav>
<div id="frames"></div>
<script>
// Each tab is its own page in an iframe, created on first visit and kept alive, so unsaved work
// survives switching tabs. Items, Loot and Shops share one page (content packs).
const PAGE = { overview: "/overview", quests: "/quests", items: "/content", loot: "/content", shops: "/content", npcs: "/npcs" };
const frames = {}, ready = {}, queue = {};

function frameFor(tab) {
  const url = PAGE[tab];
  if (!frames[url]) {
    const f = document.createElement("iframe");
    f.src = url + (url === "/content" ? "?tab=" + tab : "");
    f.title = tab;
    document.getElementById("frames").appendChild(f);
    frames[url] = f; queue[url] = [];
  }
  return frames[url];
}

function send(tab, msg) {
  const url = PAGE[tab], f = frameFor(tab);
  if (ready[url]) f.contentWindow.postMessage(msg, "*"); else queue[url].push(msg);
}

function show(tab, msg) {
  const f = frameFor(tab);
  Object.values(frames).forEach(x => x.classList.toggle("on", x === f));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (PAGE[tab] === "/content") send(tab, { contentTab: tab });
  if (msg) send(tab, msg);
  history.replaceState(null, "", "#" + tab);
}

// Pages say when they're ready, and can ask to open another tab with a command for it.
window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.ready) {
    const url = Object.keys(frames).find(u => frames[u].contentWindow === e.source);
    if (url) { ready[url] = true; queue[url].splice(0).forEach(m => frames[url].contentWindow.postMessage(m, "*")); }
  }
  if (d.nav && PAGE[d.nav]) show(d.nav, d.msg);
  if (d.broadcast) Object.values(frames).forEach(f => f.contentWindow && f.contentWindow !== e.source && f.contentWindow.postMessage(d.broadcast, "*"));
});

document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.tab));
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (PAGE[t]) show(t); });
show(PAGE[location.hash.slice(1)] ? location.hash.slice(1) : "overview");
</script>
</body>
</html>
