<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Lives Content Editor</title>
<style>
  :root {
    --bg: #f5f3ef; --panel: #ffffff; --ink: #24211d; --muted: #6f6a62; --line: #e1ddd5;
    --accent: #2f6f6a; --accent-ink: #fff; --warn: #a15c00; --bad: #b3261e; --ok: #2e7d32; --chip: #e9efed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1c1b; --panel: #232625; --ink: #e8ece9; --muted: #9aa3a0; --line: #36403d;
            --accent: #6cc0b6; --accent-ink: #10201e; --warn: #e0a24a; --bad: #ef7f76; --ok: #7cc47f; --chip: #2e3533; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  #status { color: var(--muted); margin-left: auto; }
  #status.bad { color: var(--bad); } #status.ok { color: var(--ok); }
  main { display: grid; grid-template-columns: 330px 1fr; height: calc(100vh - 54px); }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 9px 4px; border-bottom: 2px solid transparent; }
  .tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  .filters { display: flex; gap: 6px; padding: 8px; }
  .filters input { flex: 1; min-width: 0; }
  #list { overflow: auto; flex: 1; }
  .item { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--chip); }
  .item.sel { background: var(--chip); box-shadow: inset 3px 0 var(--accent); }
  .item small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); margin-left: 4px; }
  .badge.on { color: var(--accent); border: 1px solid var(--accent); }
  .section { padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--line); }
  #editor { overflow: auto; padding: 18px 24px 60px; }
  .empty { color: var(--muted); max-width: 600px; margin: 60px auto; text-align: center; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; background: var(--panel); }
  legend { padding: 0 6px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 14px; }
  label { display: block; font-size: 12px; color: var(--muted); }
  label > input, label > select { display: block; width: 100%; margin-top: 2px; color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .row input.pick { min-width: 260px; flex: 1; }
  .row input.num { width: 90px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .actions { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; align-items: center; }
  .title { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  table.kv { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.kv td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 38%; }
  .group { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
  .group .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pct { color: var(--accent); font-weight: 600; min-width: 54px; }
  .names { color: var(--muted); font-size: 12px; margin-top: 4px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } aside { max-height: 45vh; } }
</style>
</head>
<body>
<header>
  <h1>Nine Lives Content Editor</h1>
  <label style="color:var(--ink)">Pack <select id="packSel"></select></label>
  <button id="newPack">New pack</button>
  <button id="save" class="primary" title="Ctrl+S">Save pack</button>
  <span id="status">Loading…</span>
</header>
<main>
  <aside>
    <div class="tabs"><button data-tab="items" class="on">Items</button><button data-tab="loot">Loot</button><button data-tab="shops">Shops</button></div>
    <div class="filters"><input id="search" placeholder="Search name or id…"><label style="display:flex;gap:4px;align-items:center;color:var(--ink);font-size:12px"><input type="checkbox" id="onlyChanged">changed</label></div>
    <div id="list"></div>
  </aside>
  <section id="editor"></section>
</main>
<datalist id="itemList"></datalist>

<script>
// Stats worth editing (the rest, like icons and equip slots, would break the item).
const STATS = ["dispName","comment_en","stackMax","weaponDamage","weaponDamageRandom","weaponSpeed","damage","damageRandom",
  "defense","resistance","avoidance","health","mana","healthRecovery","regenerate","healthLeech","manaLeech","critRate","critDamage",
  "castSpeed","casttime","cooldown","attackSpeedAmp","dexterity","CCResistance","bowRange","bowLoadSpeed","missileRangeAmp","itemWeight","itemRareType"];
let D = {}, pack = null, packName = null, tab = "items", sel = null, dirty = false;
const names = {}, monstersByDrop = {}, npcNames = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const parseId = v => { const m = String(v).match(/^\s*(-?\d+)/); return m ? +m[1] : 0; };
const nm = id => names[id] || `item ${id}`;
const pick = id => id ? `${id} · ${names[id] || "?"}` : "";

function status(msg, cls) { const s = $("#status"); s.textContent = msg; s.className = cls || ""; }
function setDirty(v = true) { dirty = v; status(v ? "Unsaved changes" : "Saved", v ? "" : "ok"); }
async function api(path, opts) { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; }

async function boot() {
  D = await api("/api/data");
  (D.itemNames || []).forEach(i => names[i.id] = i.name);
  Object.entries(D.items || {}).forEach(([id, it]) => { if (it.name) names[id] = it.name; });
  [D.loot, D.shops].forEach(t => t && t.groups && Object.values(t.groups).forEach(g => g.forEach(s => { if (s.name) names[s.id] = s.name; })));
  [D.loot, D.shops].forEach(t => t && t.drops && Object.values(t.drops).forEach(d => {
    (d.always || []).forEach(s => { if (s.name) names[s.id] = s.name; });
    (d.random || []).forEach(g => (g.items || []).forEach(s => { if (s.name) names[s.id] = s.name; })); }));
  $("#itemList").innerHTML = Object.keys(names).map(Number).sort((a, b) => a - b).map(id => `<option value="${id} · ${esc(names[id])}">`).join("");
  (D.monsters || []).forEach(m => (monstersByDrop[m.dropId] = monstersByDrop[m.dropId] || new Set()).add(m.name));
  (D.npcs || []).forEach(n => { if (n.name) npcNames[n.cid] = n.name; });
  const packs = D.packs.length ? D.packs : ["my-content"];
  $("#packSel").innerHTML = packs.map(p => `<option>${esc(p)}</option>`).join("");
  await openPack(packs[0]);
  if (!D.loot || !D.loot.drops) status("No exported data yet: play once with ContentLoader installed (enter the world), then reload.", "bad");
}

async function openPack(name) {
  if (dirty && !confirm("Discard unsaved changes?")) { $("#packSel").value = packName; return; }
  pack = await api("/api/pack?name=" + encodeURIComponent(name));
  packName = name; sel = null; dirty = false;
  status(`Pack "${name}" loaded`);
  renderList(); renderEditor();
}

// pack sections, created on demand
const P = {
  items: () => (pack.items = pack.items || {}),
  drops: t => { pack[t] = pack[t] || {}; return (pack[t].drops = pack[t].drops || {}); },
  groups: t => { pack[t] = pack[t] || {}; return (pack[t].groups = pack[t].groups || {}); },
};
const has = (o, k) => o && Object.prototype.hasOwnProperty.call(o, k);
function tableLabel(t, id) {
  if (t === "shops") return npcNames[id] ? `${npcNames[id]}` : `Shop ${id}`;
  const m = monstersByDrop[id];
  return m ? [...m].slice(0, 4).join(", ") + (m.size > 4 ? ` +${m.size - 4}` : "") : (id >= 100000 ? "special drop" : "no monster seen using it yet");
}

// ---------------------------------------------------------------- list
function renderList() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const term = $("#search").value.trim().toLowerCase(), only = $("#onlyChanged").checked, html = [];
  const add = (key, title, sub, changed) => {
    if (only && !changed) return;
    if (term && !(`${key} ${title} ${sub}`.toLowerCase().includes(term))) return;
    const on = sel && sel.tab === tab && sel.key === key;
    html.push(`<div class="item${on ? " sel" : ""}" data-key="${esc(key)}"><b>${esc(title)}</b>${changed ? '<span class="badge on">changed</span>' : ""}<small>${esc(sub)}</small></div>`);
  };
  if (tab === "items") {
    Object.entries(D.items || {}).sort((a, b) => +a[0] - +b[0]).forEach(([id, it]) =>
      add("i:" + id, it.name || id, `#${id} · ${it.price ?? "?"} gold`, has(pack.items, id)));
  } else {
    const t = D[tab] || {};
    html.push(`<div class="section">${tab === "loot" ? "Loot tables (by drop id)" : "Shops (by vendor)"}</div>`);
    Object.keys(t.drops || {}).map(Number).sort((a, b) => a - b).forEach(id =>
      add("d:" + id, `${tab === "loot" ? "Table" : "Shop"} ${id}`, tableLabel(tab, id), has(pack[tab] && pack[tab].drops, String(id))));
    Object.keys((pack[tab] && pack[tab].drops) || {}).filter(id => !(t.drops || {})[id]).forEach(id => add("d:" + id, `${tab === "loot" ? "Table" : "Shop"} ${id}`, "new", true));
    html.push(`<div class="section">Shared item groups (used by several tables)</div>`);
    Object.keys(t.groups || {}).map(Number).sort((a, b) => a - b).forEach(id => {
      const g = t.groups[id]; add("g:" + id, `Group ${id}`, `${g.length} items: ${g.slice(0, 3).map(s => nm(s.id)).join(", ")}`, has(pack[tab] && pack[tab].groups, String(id)));
    });
  }
  $("#list").innerHTML = html.join("") || '<div class="empty">Nothing here yet.</div>';
  $("#list").querySelectorAll(".item").forEach(el => el.onclick = () => { sel = { tab, key: el.dataset.key }; renderList(); renderEditor(); });
}

// ---------------------------------------------------------------- editor
function renderEditor() {
  const ed = $("#editor");
  if (!sel) {
    ed.innerHTML = `<div class="empty"><p class="title">Pick something to change</p>
      <p><b>Items</b>: prices, stats, names. <b>Loot</b>: what monsters and chests drop. <b>Shops</b>: what vendors sell.</p>
      <p class="hint">Packs are saved in <code>Mods\\Content</code>. In game, type <code>reloadcontent</code> in the DevTools box (F7) to load changes.</p></div>`;
    return;
  }
  const [kind, key] = [sel.key[0], sel.key.slice(2)];
  if (kind === "i") itemEditor(ed, key);
  else if (kind === "d") dropEditor(ed, sel.tab, key);
  else groupEditor(ed, sel.tab, key);
}

function itemEditor(ed, id) {
  const it = D.items[id] || {}, st = it.stats || {};
  const o = (pack.items || {})[id];
  const shown = STATS.filter(s => has(st, s));
  ed.innerHTML = `<p class="title">${esc(it.name || id)}</p><p class="hint">Item ${id}</p>
    <div class="actions">${o ? '<button class="danger" id="revert">Remove my changes</button>' : '<button class="primary" id="start">Change this item</button>'}</div>
    <fieldset><legend>Price</legend><div class="grid">
      <label>Base price (original ${it.price ?? "?"})<input type="number" id="price" value="${o && o.price != null ? o.price : ""}" placeholder="${it.price ?? ""}" ${o ? "" : "disabled"}></label>
      <label>Shop markup (original ${it.buyPriceAmp ?? "?"})<input type="number" step="0.1" id="amp" value="${o && o.buyPriceAmp != null ? o.buyPriceAmp : ""}" placeholder="${it.buyPriceAmp ?? ""}" ${o ? "" : "disabled"}></label>
    </div><p class="hint">Shops sell for price × markup per item${it.price != null && it.buyPriceAmp != null ? ` (now ${Math.round(((o && o.price) ?? it.price) * ((o && o.buyPriceAmp) ?? it.buyPriceAmp))} gold each)` : ""}. Leave blank to keep the original.</p></fieldset>
    <fieldset><legend>Stats</legend><div id="stats"></div>
      ${o ? `<div class="row"><select id="newStat"><option value="">+ change another stat…</option>${STATS.filter(s => !has((o.stats || {}), s)).map(s => `<option>${s}</option>`).join("")}</select></div>` : ""}
      <p class="hint">Originals are shown on the left. Numbers for most stats; names and descriptions are text.</p></fieldset>`;
  const rows = [...new Set([...shown, ...Object.keys((o && o.stats) || {})])];
  $("#stats").innerHTML = `<table class="kv">${rows.map(s => {
    const orig = has(st, s) ? st[s] : "(none)", mine = o && o.stats && has(o.stats, s) ? o.stats[s] : "";
    return `<tr><td>${s}</td><td>${esc(orig)}</td><td>${o ? `<input data-stat="${s}" value="${esc(mine)}" placeholder="unchanged" style="width:100%">` : ""}</td></tr>`;
  }).join("")}</table>` + (rows.length ? "" : '<p class="hint">No stats on this item.</p>');
  if (!o) { $("#start").onclick = () => { P.items()[id] = { name: it.name }; setDirty(); renderList(); renderEditor(); }; return; }
  $("#revert").onclick = () => { delete pack.items[id]; setDirty(); renderList(); renderEditor(); };
  const num = (el, k) => { const v = el.value.trim(); if (v === "") delete o[k]; else o[k] = +v; setDirty(); renderList(); };
  $("#price").onchange = e => { num(e.target, "price"); renderEditor(); };
  $("#amp").onchange = e => { num(e.target, "buyPriceAmp"); renderEditor(); };
  ed.querySelectorAll("[data-stat]").forEach(el => el.onchange = () => {
    const s = el.dataset.stat, v = el.value.trim(); o.stats = o.stats || {};
    if (v === "") delete o.stats[s];
    else o.stats[s] = v === "true" ? true : v === "false" ? false : (isNaN(+v) || s === "dispName" || s.startsWith("comment") ? v : +v);
    if (!Object.keys(o.stats).length) delete o.stats;
    setDirty();
  });
  $("#newStat").onchange = e => { if (!e.target.value) return; o.stats = o.stats || {}; o.stats[e.target.value] = has(st, e.target.value) ? st[e.target.value] : 0; setDirty(); renderEditor(); };
}

function groupSummary(t, g) {
  if (g.group) { const sg = ((D[t] || {}).groups || {})[g.group] || []; const mine = (((pack[t] || {}).groups) || {})[g.group];
    const items = mine || sg; return `shared group ${g.group}${mine ? " (changed in your pack)" : ""}: ${items.length} items, e.g. ${items.slice(0, 5).map(s => nm(s.id)).join(", ")}`; }
  return (g.items || []).map(s => `${nm(s.id)}${s.count > 1 ? " ×" + s.count : ""}`).join(", ") || "(empty)";
}

function dropEditor(ed, t, id) {
  const orig = ((D[t] || {}).drops || {})[id], mine = (((pack[t] || {}).drops) || {})[id];
  const d = mine || orig || {}, ro = !mine, dis = ro ? "disabled" : "";
  const total = (d.random || []).reduce((s, g) => s + (g.rate || 0), 0) || 1;
  ed.innerHTML = `<p class="title">${t === "loot" ? "Loot table" : "Shop"} ${id}</p><p class="hint">${esc(tableLabel(t, id))}</p>
    <div class="actions">${ro ? '<button class="primary" id="start">Change this table</button><span class="hint">Shows the original. Changing it copies it into your pack first.</span>'
                              : `<button class="danger" id="revert">Back to the original</button>${orig ? "" : '<span class="badge on">new table</span>'}`}</div>
    <fieldset><legend>How much</legend><div class="grid">
      ${t === "loot" ? `<label>Chest chance (0–1)<input type="number" step="0.01" data-f="dropRate" value="${d.dropRate ?? ""}" ${dis}></label>` : ""}
      <label>Fewest items<input type="number" data-f="min" value="${d.min ?? ""}" ${dis}></label>
      <label>Most items<input type="number" data-f="max" value="${d.max ?? ""}" ${dis}></label>
    </div>${t === "loot" ? `<p class="hint">${d.dropRate != null ? `A monster using this table leaves a chest ${Math.round(d.dropRate * 100)}% of the time.` : ""}</p>` : ""}</fieldset>
    <fieldset><legend>Always included</legend><div id="always"></div>${ro ? "" : '<button id="addAlways">+ Item</button>'}</fieldset>
    <fieldset><legend>Random picks</legend>
      <p class="hint">For the rest, a group is picked by weight, then one item from it (count = up to).</p>
      <div id="random"></div>${ro ? "" : '<button id="addGroup">+ Group with its own items</button> <button id="addShared">+ Use a shared group</button>'}</fieldset>`;
  $("#always").innerHTML = itemRows(d.always || [], ro, "always") || '<p class="hint">None.</p>';
  $("#random").innerHTML = (d.random || []).map((g, i) => `<div class="group" data-g="${i}"><div class="head">
      <span class="pct">${Math.round((g.rate || 0) / total * 100)}%</span>
      weight <input class="num" type="number" data-gf="rate" value="${g.rate}" ${dis}>
      ${g.group ? `shared group <input class="num" type="number" data-gf="group" value="${g.group}" ${dis}>` : ""}
      ${ro ? "" : `<button class="danger" data-rmg="${i}">Remove group</button>`}</div>
      ${g.group ? `<div class="names">${esc(groupSummary(t, g))}</div>` : `<div>${itemRows(g.items || [], ro, "g" + i)}</div>${ro ? "" : `<button data-addin="${i}">+ Item</button>`}`}
    </div>`).join("") || '<p class="hint">None.</p>';
  if (ro) { $("#start").onclick = () => { P.drops(t)[id] = clone(orig || { min: 1, max: 1, random: [] }); setDirty(); renderList(); renderEditor(); }; return; }
  $("#revert").onclick = () => { delete pack[t].drops[id]; setDirty(); renderList(); renderEditor(); };
  ed.querySelectorAll("[data-f]").forEach(el => el.onchange = () => { const v = el.value.trim(); if (v === "") delete d[el.dataset.f]; else d[el.dataset.f] = +v; setDirty(); renderEditor(); });
  ed.querySelectorAll("[data-gf]").forEach(el => el.onchange = () => { d.random[+el.closest("[data-g]").dataset.g][el.dataset.gf] = +el.value || 0; setDirty(); renderEditor(); });
  ed.querySelectorAll("[data-rmg]").forEach(b => b.onclick = () => { d.random.splice(+b.dataset.rmg, 1); setDirty(); renderEditor(); });
  ed.querySelectorAll("[data-addin]").forEach(b => b.onclick = () => { const g = d.random[+b.dataset.addin]; (g.items = g.items || []).push({ id: 0, count: 1 }); setDirty(); renderEditor(); });
  $("#addAlways").onclick = () => { (d.always = d.always || []).push({ id: 0, count: 1 }); setDirty(); renderEditor(); };
  $("#addGroup").onclick = () => { (d.random = d.random || []).push({ rate: 100, items: [{ id: 0, count: 1 }] }); setDirty(); renderEditor(); };
  $("#addShared").onclick = () => { const gid = parseId(prompt("Shared group id (see 'Shared item groups' in the list):", "11")); if (!gid) return; (d.random = d.random || []).push({ rate: 100, group: gid }); setDirty(); renderEditor(); };
  wireItemRows(ed, key => key === "always" ? d.always : d.random[+key.slice(1)].items);
}

function groupEditor(ed, t, id) {
  const orig = ((D[t] || {}).groups || {})[id] || [], mine = (((pack[t] || {}).groups) || {})[id];
  const g = mine || orig, ro = !mine;
  const users = Object.entries((D[t] || {}).drops || {}).filter(([, d]) => (d.random || []).some(r => r.group == id)).map(([k]) => k);
  ed.innerHTML = `<p class="title">Shared group ${id}</p><p class="hint">${g.length} items. Used by ${users.length} table(s)${users.length ? ": " + users.slice(0, 12).join(", ") + (users.length > 12 ? "…" : "") : ""}. Changing it changes all of them.</p>
    <div class="actions">${ro ? '<button class="primary" id="start">Change this group</button>' : '<button class="danger" id="revert">Back to the original</button>'}</div>
    <fieldset><legend>Items</legend><div id="gitems"></div>${ro ? "" : '<button id="addIt">+ Item</button>'}<p class="hint">Count = up to how many of that item drop at once.</p></fieldset>`;
  $("#gitems").innerHTML = itemRows(g, ro, "grp") || '<p class="hint">Empty.</p>';
  if (ro) { $("#start").onclick = () => { P.groups(t)[id] = clone(orig); setDirty(); renderList(); renderEditor(); }; return; }
  $("#revert").onclick = () => { delete pack[t].groups[id]; setDirty(); renderList(); renderEditor(); };
  $("#addIt").onclick = () => { g.push({ id: 0, count: 1 }); setDirty(); renderEditor(); };
  wireItemRows(ed, () => g);
}

function itemRows(list, ro, key) {
  const dis = ro ? "disabled" : "";
  return list.map((s, i) => `<div class="row" data-list="${key}" data-i="${i}">
      <input class="num" type="number" data-sf="count" value="${s.count}" ${dis}> ×
      <input class="pick" list="itemList" data-sf="id" value="${esc(pick(s.id))}" placeholder="type an item name" ${dis}>
      ${ro ? "" : `<button class="danger" data-rmi="${i}" title="Remove">✕</button>`}</div>`).join("");
}
function wireItemRows(ed, listFor) {
  ed.querySelectorAll("[data-list]").forEach(row => {
    const list = () => listFor(row.dataset.list), i = +row.dataset.i;
    row.querySelectorAll("[data-sf]").forEach(el => el.onchange = () => {
      const s = list()[i];
      if (el.dataset.sf === "id") { s.id = parseId(el.value); s.name = names[s.id]; } else s.count = Math.max(1, +el.value || 1);
      setDirty();
    });
    const rm = row.querySelector("[data-rmi]"); if (rm) rm.onclick = () => { list().splice(i, 1); setDirty(); renderEditor(); };
  });
}

// ---------------------------------------------------------------- save
function tidy() {
  ["loot", "shops"].forEach(t => { if (!pack[t]) return;
    ["drops", "groups"].forEach(k => { if (pack[t][k] && !Object.keys(pack[t][k]).length) delete pack[t][k]; });
    if (!Object.keys(pack[t]).length) delete pack[t]; });
  if (pack.items && !Object.keys(pack.items).length) delete pack.items;
}
function problems() {
  const p = [], bad = s => !(s.id > 0) || !names[s.id];
  ["loot", "shops"].forEach(t => {
    Object.entries((pack[t] || {}).drops || {}).forEach(([id, d]) => {
      if ((d.always || []).some(bad) || (d.random || []).some(g => (g.items || []).some(bad))) p.push(`${t} table ${id} has an unknown item`);
      if (d.min != null && d.max != null && d.min > d.max) p.push(`${t} table ${id}: fewest is more than most`);
    });
    Object.entries((pack[t] || {}).groups || {}).forEach(([id, g]) => { if (g.some(bad)) p.push(`${t} group ${id} has an unknown item`); });
  });
  return p;
}
async function save() {
  const p = problems();
  if (p.length && !confirm(`Check: ${p.slice(0, 3).join("; ")}. Save anyway?`)) return;
  pack.name = pack.name || packName; tidy();
  try {
    const r = await api("/api/pack?name=" + encodeURIComponent(packName), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pack) });
    setDirty(false); status(`Saved to ${r.saved}. In game: reloadcontent (F7).`, "ok"); renderList();
  } catch (e) { status("Save failed: " + e.message, "bad"); }
}

$("#save").onclick = save;
$("#packSel").onchange = e => openPack(e.target.value);
$("#newPack").onclick = () => {
  const n = prompt("Name for the new pack (letters, numbers, spaces, - and _):", "my-content"); if (!n) return;
  if (![...$("#packSel").options].some(o => o.value === n)) $("#packSel").insertAdjacentHTML("beforeend", `<option>${esc(n)}</option>`);
  $("#packSel").value = n; openPack(n);
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderList(); });
$("#search").oninput = renderList; $("#onlyChanged").onchange = renderList;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
boot().catch(e => status("Couldn't load: " + e.message, "bad"));
</script>
</body>
</html>
