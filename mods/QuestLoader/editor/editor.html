<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Lives Quest Editor</title>
<style>
  :root {
    --bg: #f5f3ef; --panel: #ffffff; --ink: #24211d; --muted: #6f6a62; --line: #e1ddd5;
    --accent: #8a4b2a; --accent-ink: #fff; --warn: #a15c00; --bad: #b3261e; --ok: #2e7d32; --chip: #efe9df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --panel: #252321; --ink: #ece8e1; --muted: #a39d93; --line: #3a3733;
            --accent: #d08a5c; --accent-ink: #1b1a18; --warn: #e0a24a; --bad: #ef7f76; --ok: #7cc47f; --chip: #34312d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  #status { color: var(--muted); margin-left: auto; }
  #status.bad { color: var(--bad); } #status.ok { color: var(--ok); }
  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 54px); }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 9px; border-bottom: 2px solid transparent; }
  .tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  #search { margin: 8px; }
  #list { overflow: auto; flex: 1; }
  .item { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--chip); }
  .item.sel { background: var(--chip); box-shadow: inset 3px 0 var(--accent); }
  .item small { display: block; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); margin-left: 4px; }
  .badge.warn { color: var(--warn); }
  #editor { overflow: auto; padding: 18px 24px 60px; }
  .empty { color: var(--muted); max-width: 560px; margin: 60px auto; text-align: center; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; background: var(--panel); }
  legend { padding: 0 6px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
  label { display: block; font-size: 12px; color: var(--muted); }
  label > input, label > select { display: block; width: 100%; margin-top: 2px; color: var(--ink); }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .checks label { display: flex; gap: 5px; align-items: center; color: var(--ink); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .row input.item-pick { min-width: 260px; flex: 1; }
  .row input.num { width: 90px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .actions { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; align-items: center; }
  .title { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .problems { color: var(--bad); margin: 0 0 12px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } aside { max-height: 45vh; } }
</style>
</head>
<body>
<header>
  <h1>Nine Lives Quest Editor</h1>
  <label style="color:var(--ink)">Pack <select id="packSel"></select></label>
  <button id="newPack">New pack</button>
  <button id="save" class="primary" title="Ctrl+S">Save pack</button>
  <span id="status">Loading…</span>
</header>
<main>
  <aside>
    <div class="tabs"><button id="tabPack" class="on">My pack</button><button id="tabOrig">Original quests</button></div>
    <input id="search" placeholder="Search title, id, NPC…">
    <div id="list"></div>
  </aside>
  <section id="editor"></section>
</main>
<datalist id="itemList"></datalist>
<datalist id="npcList"></datalist>

<script>
const TYPES = ["Normal","Daily","Repeatable","Seasonal","Errand","Kill","Collect","Defence","Message","ItemReceive","TimeAttack","Main"];
const FIRST_MOD_ID = 900000001, FIRST_MOD_FLAG = 9000;
let D = { originals: [], items: [], npcs: [], packs: [] };
let pack = null, packName = null, tab = "pack", sel = null, dirty = false;
const itemName = {}, npcName = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function status(msg, cls) { const s = $("#status"); s.textContent = msg; s.className = cls || ""; }
function setDirty(v = true) { dirty = v; status(v ? "Unsaved changes" : "Saved", v ? "" : "ok"); }

async function api(path, opts) {
  const r = await fetch(path, opts); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

async function boot() {
  D = await api("/api/data");
  D.items.forEach(i => itemName[i.id] = i.name);
  $("#itemList").innerHTML = D.items.map(i => `<option value="${i.id} · ${esc(i.name)}">`).join("");
  buildNpcs();
  const packs = D.packs.length ? D.packs : ["my-quests"];
  $("#packSel").innerHTML = packs.map(p => `<option>${esc(p)}</option>`).join("");
  await openPack(packs[0]);
  if (!D.originals.length) status("No exported quests yet: play once with QuestLoader installed, then reload.", "bad");
}

function buildNpcs() {
  const uses = {};
  D.originals.forEach(q => [q.giver, q.ender].forEach(c => { if (c > 0) (uses[c] = uses[c] || new Set()).add(q.title); }));
  const byCid = {};
  D.npcs.forEach(n => { (byCid[n.cid] = byCid[n.cid] || []).push(n); });
  const cids = new Set([...Object.keys(uses), ...Object.keys(byCid)].map(Number));
  const opts = [];
  [...cids].sort((a, b) => a - b).forEach(c => {
    const seen = byCid[c] ? byCid[c].map(n => `${n.name || "?"} (${(n.zone || "").replace("Zone_", "")})`).join(", ") : null;
    const q = uses[c] ? [...uses[c]].slice(0, 3).join(" / ") : null;
    const label = seen || ("quests: " + q);
    npcName[c] = label;
    opts.push(`<option value="${c} · ${esc(label)}">`);
  });
  $("#npcList").innerHTML = opts.join("");
}

async function openPack(name) {
  if (dirty && !confirm("Discard unsaved changes?")) { $("#packSel").value = packName; return; }
  pack = await api("/api/pack?name=" + encodeURIComponent(name));
  pack.quests = pack.quests || []; packName = name; sel = null; dirty = false;
  status(`Pack "${name}": ${pack.quests.length} quest(s)`);
  renderList(); renderEditor();
}

// ---------------------------------------------------------------- list
function renderList() {
  $("#tabPack").textContent = `My pack (${pack.quests.length})`;
  $("#tabOrig").textContent = `Original quests (${D.originals.length})`;
  $("#tabPack").classList.toggle("on", tab === "pack"); $("#tabOrig").classList.toggle("on", tab === "orig");
  const term = $("#search").value.trim().toLowerCase();
  const src = tab === "pack" ? pack.quests : D.originals;
  const origIds = new Set(D.originals.map(q => q.id));
  const html = [];
  src.forEach((q, i) => {
    const hay = `${q.id} ${q.title} ${npcName[q.giver] || ""} ${q.description || ""}`.toLowerCase();
    if (term && !hay.includes(term)) return;
    const on = sel && sel.tab === tab && sel.i === i;
    const tag = tab === "pack" && origIds.has(q.id) ? '<span class="badge warn">replaces original</span>' : "";
    html.push(`<div class="item${on ? " sel" : ""}" data-i="${i}"><b>${esc(q.title || "(untitled)")}</b>${tag}
      <small>#${q.id} · from ${esc(npcName[q.giver] || q.giver || "no NPC")}</small></div>`);
  });
  $("#list").innerHTML = html.join("") || `<div class="empty">${tab === "pack" ? "No quests in this pack yet." : "Nothing matches."}</div>`;
  $("#list").querySelectorAll(".item").forEach(el => el.onclick = () => { sel = { tab, i: +el.dataset.i }; renderList(); renderEditor(); });
}

// ---------------------------------------------------------------- helpers
const nextId = () => Math.max(FIRST_MOD_ID - 1, ...pack.quests.map(q => q.id).filter(i => i >= FIRST_MOD_ID)) + 1;
const nextFlag = () => Math.max(FIRST_MOD_FLAG - 1, ...pack.quests.map(q => q.clearFlag || 0).filter(f => f >= FIRST_MOD_FLAG)) + 1;
const pickVal = (id, names) => id ? `${id} · ${names[id] || "?"}` : "";
const parseId = v => { const m = String(v).match(/^\s*(-?\d+)/); return m ? +m[1] : 0; };
const clone = o => JSON.parse(JSON.stringify(o));

function newQuest() {
  const q = { id: nextId(), title: "New quest", objective: "", types: ["Normal", "Collect"], enabled: true,
    giver: 0, ender: 0, description: "", descriptionForEnder: "", targets: [], rewards: [{ kind: "exp", amount: 100 }], clearFlag: nextFlag() };
  pack.quests.push(q); tab = "pack"; sel = { tab, i: pack.quests.length - 1 }; setDirty(); renderList(); renderEditor();
}

function copyOriginal(q, keepId) {
  const c = clone(q);
  if (!keepId) { c.id = nextId(); c.clearFlag = nextFlag(); c.title = q.title + " (copy)"; }
  const existing = pack.quests.findIndex(x => x.id === c.id);
  if (existing >= 0) pack.quests[existing] = c; else pack.quests.push(c);
  tab = "pack"; sel = { tab, i: existing >= 0 ? existing : pack.quests.length - 1 }; setDirty(); renderList(); renderEditor();
}

// ---------------------------------------------------------------- editor form
function renderEditor() {
  const ed = $("#editor");
  if (!sel) {
    ed.innerHTML = `<div class="empty"><p class="title">Pick a quest, or make a new one</p>
      <p>Your pack's quests are on the left. Browse <b>Original quests</b> to copy one as a starting point.</p>
      <p><button class="primary" id="mk">New quest</button></p>
      <p class="hint">Packs are saved in <code>Mods\\Quests</code>. Restart the game to load changes.</p></div>`;
    $("#mk").onclick = newQuest; return;
  }
  const ro = sel.tab === "orig";
  const q = ro ? D.originals[sel.i] : pack.quests[sel.i];
  const dis = ro ? "disabled" : "";
  const isOrigId = D.originals.some(o => o.id === q.id);

  ed.innerHTML = `
    <div class="actions">
      ${ro ? `<span class="badge">Original quest (read-only)</span>
              <button class="primary" id="cpNew">Copy as a new quest</button>
              <button id="cpSame" title="Same id: your version replaces the original in game">Replace this quest in my pack</button>`
           : `<button id="mk">New quest</button><button class="danger" id="del">Delete from pack</button>
              ${isOrigId ? '<span class="badge warn">Same id as an original: this replaces it in game</span>' : ""}`}
    </div>
    <div class="problems" id="problems"></div>
    <fieldset><legend>Basics</legend><div class="grid">
      <label>Quest id<input type="number" data-k="id" value="${q.id}" ${dis}></label>
      <label>Title<input data-k="title" value="${esc(q.title)}" ${dis}></label>
      <label>Objective (short line in the quest log)<input data-k="objective" value="${esc(q.objective)}" ${dis}></label>
      <label>Given by NPC<input list="npcList" data-k="giver" data-pick="npc" value="${esc(pickVal(q.giver, npcName))}" ${dis}></label>
      <label>Handed in to NPC<input list="npcList" data-k="ender" data-pick="npc" value="${esc(pickVal(q.ender, npcName))}" ${dis}></label>
      <label>Priority (higher shows first)<input type="number" data-k="priority" value="${q.priority || 0}" ${dis}></label>
    </div>
    <p class="hint">Type part of an NPC's name or id. NPCs appear here once QuestLoader has seen them in a zone you've visited.</p>
    <div class="checks" style="margin-top:8px">
      ${["enabled","autoAccept","autoReopen","repeatable"].map(k => `<label><input type="checkbox" data-k="${k}" ${q[k] ? "checked" : ""} ${dis}>${k}</label>`).join("")}
    </div>
    <div class="checks" style="margin-top:8px"><span class="hint">Type:</span>
      ${TYPES.map(t => `<label><input type="checkbox" data-type="${t}" ${(q.types || []).includes(t) ? "checked" : ""} ${dis}>${t}</label>`).join("")}
    </div></fieldset>

    <fieldset><legend>Dialogue</legend>
      <label>What the giver says<textarea data-k="description" ${dis}>${esc(q.description)}</textarea></label>
      <label style="margin-top:8px">What the NPC says when you hand in<textarea data-k="descriptionForEnder" ${dis}>${esc(q.descriptionForEnder)}</textarea></label>
      <label style="margin-top:8px">Extra message lines (one per line, for Message quests)<textarea data-k="messages" style="min-height:50px" ${dis}>${esc((q.messages || []).join("\n"))}</textarea></label>
      ${q.translations ? `<p class="hint">Has other languages (${Object.keys(q.translations).join(", ")}): kept as they are, not edited here.</p>` : ""}
    </fieldset>

    <fieldset><legend>Goal</legend><div id="targets"></div>
      ${ro ? "" : '<button data-add="targets">+ Bring items</button> <button data-add="kills">+ Defeat monsters</button>'}
      <p class="hint">Item count -1 = just own one, it isn't taken (used for letters and keys).</p></fieldset>

    <fieldset><legend>Rewards</legend><div id="rewards"></div>
      ${ro ? "" : '<button data-add="rewards">+ Reward</button>'}</fieldset>

    <fieldset><legend>Items given when you accept</legend><div id="receives"></div>
      ${ro ? "" : '<button data-add="receives">+ Item</button>'}</fieldset>

    <fieldset><legend>Progress flags (advanced)</legend><div class="grid">
      <label>Flag set when cleared<input type="number" data-k="clearFlag" value="${q.clearFlag || 0}" ${dis}></label>
      <label>Work flag set when cleared<input type="number" data-k="clearWorkFlag" value="${q.clearWorkFlag || 0}" ${dis}></label>
    </div>
    ${ro ? "" : '<p class="hint">Mod quests should use flags 9000–9999. <button id="freeFlag">Use next free flag</button></p>'}
      <label style="margin-top:8px">Requirements before it's offered (JSON)<textarea data-json="requires" style="min-height:60px" ${dis}>${esc(q.requires ? JSON.stringify(q.requires, null, 1) : "")}</textarea></label>
      <p class="hint">e.g. <code>{"flagsAll":[{"flag":8138,"on":true}]}</code> = only after the quest with clear flag 8138. Also flagsAny, itemsAll, itemsAny.</p>
      <label style="margin-top:8px">Flags changed when cleared (JSON)<textarea data-json="setFlagsOnClear" style="min-height:40px" ${dis}>${esc(q.setFlagsOnClear ? JSON.stringify(q.setFlagsOnClear) : "")}</textarea></label>
    </fieldset>`;

  renderRows("targets", q, ro); renderRows("rewards", q, ro); renderRows("receives", q, ro);
  if (ro) {
    $("#cpNew").onclick = () => copyOriginal(q, false);
    $("#cpSame").onclick = () => copyOriginal(q, true);
    return;
  }
  $("#mk").onclick = newQuest;
  $("#del").onclick = () => { if (confirm(`Delete "${q.title}" from this pack?`)) { pack.quests.splice(sel.i, 1); sel = null; setDirty(); renderList(); renderEditor(); } };
  $("#freeFlag").onclick = () => { q.clearFlag = nextFlag(); setDirty(); renderEditor(); };
  ed.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const k = b.dataset.add;
    if (k === "targets") (q.targets = q.targets || []).push({ kind: "item", item: 0, count: 1, includeBank: true });
    if (k === "kills") (q.targets = q.targets || []).push({ kind: "kill", monster: "", count: 5 });
    if (k === "rewards") (q.rewards = q.rewards || []).push({ kind: "gold", amount: 100 });
    if (k === "receives") (q.receives = q.receives || []).push({ item: 0, count: 1 });
    setDirty(); renderEditor();
  });
  ed.querySelectorAll("[data-k]").forEach(el => el.oninput = el.onchange = () => {
    const k = el.dataset.k;
    if (el.type === "checkbox") q[k] = el.checked;
    else if (el.dataset.pick) q[k] = parseId(el.value);
    else if (el.type === "number") q[k] = +el.value || 0;
    else if (k === "messages") q[k] = el.value ? el.value.split("\n") : undefined;
    else q[k] = el.value;
    setDirty(); if (k === "title" || k === "id" || k === "giver") renderList();
  });
  ed.querySelectorAll("[data-type]").forEach(el => el.onchange = () => {
    q.types = TYPES.filter(t => ed.querySelector(`[data-type="${t}"]`).checked); setDirty();
  });
  ed.querySelectorAll("[data-json]").forEach(el => el.onchange = () => {
    const k = el.dataset.json;
    try { q[k] = el.value.trim() ? JSON.parse(el.value) : undefined; el.style.borderColor = ""; setDirty(); }
    catch { el.style.borderColor = "var(--bad)"; status(`"${k}" isn't valid JSON`, "bad"); }
  });
  showProblems(q);
}

function renderRows(key, q, ro) {
  const box = $("#" + key); const rows = q[key] || []; const dis = ro ? "disabled" : "";
  box.innerHTML = rows.map((r, i) => {
    let inner = "";
    if (key === "targets" && r.kind === "kill")
      inner = `Defeat <input class="num" type="number" data-f="count" value="${r.count}" ${dis}>
        × monster named <input data-f="monster" value="${esc(r.monster)}" placeholder="name" ${dis}>
        or id <input class="num" type="number" data-f="monsterId" value="${r.monsterId || 0}" ${dis}>`;
    else if (key === "targets")
      inner = `Bring <input class="num" type="number" data-f="count" value="${r.count}" ${dis}>
        × <input class="item-pick" list="itemList" data-f="item" data-pick="item" value="${esc(pickVal(r.item, itemName))}" placeholder="type an item name" ${dis}>
        <label style="display:inline-flex;gap:4px;color:var(--ink)"><input type="checkbox" data-f="includeBank" ${r.includeBank ? "checked" : ""} ${dis}>counts bank</label>`;
    else if (key === "rewards")
      inner = `<select data-f="kind" ${dis}>${["exp","gold","item"].map(k => `<option ${r.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select>
        <input class="num" type="number" data-f="amount" value="${r.amount}" ${dis}>
        ${r.kind === "item" ? `× <input class="item-pick" list="itemList" data-f="item" data-pick="item" value="${esc(pickVal(r.item, itemName))}" placeholder="type an item name" ${dis}>` : ""}`;
    else
      inner = `<input class="num" type="number" data-f="count" value="${r.count}" ${dis}>
        × <input class="item-pick" list="itemList" data-f="item" data-pick="item" value="${esc(pickVal(r.item, itemName))}" placeholder="type an item name" ${dis}>`;
    return `<div class="row" data-row="${i}">${inner}${ro ? "" : ` <button class="danger" data-rm="${i}" title="Remove">✕</button>`}</div>`;
  }).join("") || '<p class="hint">None.</p>';
  if (ro) return;
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { rows.splice(+b.dataset.rm, 1); setDirty(); renderEditor(); });
  box.querySelectorAll("[data-f]").forEach(el => el.onchange = () => {
    const r = rows[+el.closest("[data-row]").dataset.row], f = el.dataset.f;
    if (el.type === "checkbox") r[f] = el.checked;
    else if (el.dataset.pick) r[f] = parseId(el.value);
    else if (el.type === "number") r[f] = +el.value || 0;
    else r[f] = el.value;
    // Switching reward kind: item counts start at 1, gold/exp amounts at 100.
    if (f === "kind") { r.amount = r.kind === "item" ? 1 : 100; if (r.kind !== "item") delete r.item; }
    setDirty(); if (f === "kind") renderEditor(); else showProblems(q);
  });
}

// ---------------------------------------------------------------- checks & save
function problemsOf(q) {
  const p = [];
  if (!q.title) p.push("needs a title");
  if (!(q.giver > 0)) p.push("needs an NPC who gives it");
  if (!(q.ender > 0)) p.push("needs an NPC to hand it in to");
  (q.targets || []).forEach(t => { if (t.kind === "item" && !itemName[t.item]) p.push("a goal has an unknown item"); });
  if ((q.targets || []).some(t => t.kind === "item") && !(q.types || []).includes("Collect"))
    p.push("item goals need the Collect type (QuestLoader adds it for you in game)");
  (q.rewards || []).forEach(r => { if (r.kind === "item" && !itemName[r.item]) p.push("a reward has an unknown item"); });
  if (pack.quests.filter(x => x.id === q.id).length > 1) p.push("id " + q.id + " is used twice in this pack");
  return p;
}
function showProblems(q) { const el = $("#problems"); if (el) el.textContent = problemsOf(q).length ? "Check: " + problemsOf(q).join(" · ") : ""; }

async function save() {
  const bad = pack.quests.map(q => [q, problemsOf(q)]).filter(x => x[1].length);
  if (bad.length && !confirm(`${bad.length} quest(s) have problems (e.g. "${bad[0][0].title}": ${bad[0][1][0]}). Save anyway?`)) return;
  pack.name = pack.name || packName;
  try {
    const r = await api("/api/pack?name=" + encodeURIComponent(packName), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pack) });
    setDirty(false); status(`Saved ${r.quests} quest(s) to ${r.saved}. Restart the game to load them.`, "ok");
  } catch (e) { status("Save failed: " + e.message, "bad"); }
}

$("#save").onclick = save;
$("#packSel").onchange = e => openPack(e.target.value);
$("#newPack").onclick = () => {
  const n = prompt("Name for the new pack (letters, numbers, spaces, - and _):", "my-quests");
  if (!n) return;
  if (![...$("#packSel").options].some(o => o.value === n)) $("#packSel").insertAdjacentHTML("beforeend", `<option>${esc(n)}</option>`);
  $("#packSel").value = n; openPack(n);
};
$("#tabPack").onclick = () => { tab = "pack"; renderList(); };
$("#tabOrig").onclick = () => { tab = "orig"; renderList(); };
$("#search").oninput = renderList;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
boot().catch(e => status("Couldn't load: " + e.message, "bad"));
</script>
</body>
</html>
